# Build the database and the app, add the MOE headword recordings, publish on GitHub Pages.
# One-time setup in the repo: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Build and publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python packages
        run: pip install -r requirements.txt

      # open data sources (pinned in data/fetch.sh) and the MOE audio zip: downloaded once, then cached
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/fetch.sh') }}-audio-2

      - name: Database
        run: make db

      - name: Check lessons
        run: |
          make lint
          make test

      - name: Podcast feed (隔壁 ê 戇人, notes only; audio is streamed from SoundOn)
        run: python3 tools/fetch_podcast.py
        continue-on-error: true

      - name: Podcast summary (shown as a notice on the run)
        run: |
          python3 - <<'EOF'
          import sys; sys.path.insert(0, 'tools'); import podcast
          p = podcast.load()
          if not p: print('::warning::podcast feed missing'); raise SystemExit
          eps = p['episodes']; e = eps[0]
          print(f"::notice::{p['title']} | {len(eps)} episodes | newest EP{e['n']} {e['date']} | chapters {len(e['chapters'])} | vocab {len(e['vocab'])} | fixes {len(e['fixes'])} | other {len(e['other'])} | vocab all {sum(len(x['vocab']) for x in eps)} | no chapters {sum(1 for x in eps if not x['chapters'])} | no vocab {sum(1 for x in eps if not x['vocab'])}")
          print('::notice::sample vocab ' + ' || '.join(f"{v['h']} {v['t']} -> {v['en'][:30]}" for v in e['vocab'][:4]))
          print('::notice::sample chapters ' + ' || '.join(f"{c['s']} {c['t'][:20]} / {c['zh'][:15]}" for c in e['chapters'][:3]))
          print('::notice::sample other ' + ' || '.join(x[:40] for x in e['other'][:4]))
          EOF
        continue-on-error: true

      - name: App (first pass, lists the recordings it needs)
        run: make app

      - name: Recordings (教育部臺灣台語常用詞辭典, CC BY-ND 3.0 TW)
        run: python3 tools/fetch_audio.py
        # if the MOE site cannot be reached, publish without sound rather than not at all
        continue-on-error: true

      - name: App (second pass, with the recordings)
        run: make app

      - name: Site (installable app, icon, full screen, offline)
        run: python3 tools/site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
