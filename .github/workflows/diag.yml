name: diag (temporary)
on:
  push:
    branches: [diag-audio]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas odfpy
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/fetch.sh') }}-audio-3
      - run: ls -la data/raw/moe-audio || true
      - run: python3 tools/fetch_audio.py --table
      - name: rows
        run: |
          python3 - <<'PY'
          import pandas as pd, zipfile, re, os
          ods = 'data/raw/moe-audio/kautian.ods'
          sh = pd.read_excel(ods, engine='odf', sheet_name=None, dtype=str)
          print('::notice::sheets ' + ' | '.join(f"{k}: {list(v.columns)}" for k, v in sh.items()))
          w = sh['詞目']
          hit = w[w['漢字'].fillna('').str.contains('最|贅')]
          print('::notice title=rows 最 贅::' + ' ## '.join(f"{r['詞目id']} {r['詞目類型']} {r['漢字']} {r['羅馬字']} file={r['羅馬字音檔檔名']}" for _, r in hit.iterrows()))
          tw = w[w['羅馬字'].fillna('').str.contains('tsuè')]
          print('::notice title=rows reading tsuè::' + ' ## '.join(f"{r['詞目id']} {r['漢字']} {r['羅馬字']} file={r['羅馬字音檔檔名']}" for _, r in tw.head(60).iterrows()))
          for k in ('又唸作', '俗唸作'):
              x = sh[k]; y = x[x['漢字'].fillna('').str.contains('最') | x['羅馬字'].fillna('').str.contains('tsuè')]
              print(f'::notice title={k}::' + ' ## '.join(' '.join(str(v) for v in r) for _, r in y.head(40).iterrows()))
          ex = sh['例句']; e = ex[ex['漢字'].fillna('').str.startswith('最')]
          print('::notice title=examples starting with 最::' + ' ## '.join(f"{r['漢字']} {r['羅馬字']} {r['音檔檔名']}" for _, r in e.head(20).iterrows()))
          ids = [str(i) for i in hit['詞目id']]
          z = 'data/raw/moe-audio/sutiau-mp3.zip'
          if os.path.exists(z):
              names = zipfile.ZipFile(z).namelist()
              print('::notice title=zip::' + ' '.join(n for n in names if re.search(r'(?:^|/)(' + '|'.join(ids) + r')\(', n)) + f' || with (2)+: {sum(1 for n in names if re.search(r"\\(([2-9])\\)\\.mp3$", n))}')
          PY
