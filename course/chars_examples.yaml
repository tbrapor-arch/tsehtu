# pinned in course/chars_order.txt; every listed character needs an entry here (tools/lint.py). docs/taigi-chars.md.
# lesson: [lesson id, line n]  a course line (the build copies it: Hàn-jī, Tâi-lô, English, tokens, link)
# moe: {word, hanji}          an MOE example, found in the database by its headword and Hàn-jī and shown
#                             unaltered (Tâi-lô, Mandarin) with attribution; en: is ours, labelled as such
# created: {hanji, tailo, en} written for this list, every word an MOE word; "not checked by a native speaker"
# reading_only: true          no MOE definition and no MOE word that has one: the reading only (owner, 17 Nov 2026)
# moe2: {word, hanji}         an MOE sentence shown folded under a lesson line as "Dictionary example"
# also: [lesson id, line n]   a lesson line longer than 24 syllables that gave way to the MOE sentence (linked)
# also_read: {r, word}        a reading added to the listed ones, attested by an MOE word (嘓 kho̍k in 嘓魚)
# conf: H/M/L                 Claude's confidence in a written sentence
# The character meanings (English) are in course/glosses_en.tsv (column 4 `moe-sense`: from the MOE definition).
# Draft 17 Nov 2026 (Claude), owner's decisions applied the same day. Not checked by a native speaker.
