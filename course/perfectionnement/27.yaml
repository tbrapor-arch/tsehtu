    - {tailo: "Tuà siânn-tshī, sīm-tsì keh-piah tuà siánn-lâng to m̄ tsai.", hanji: "蹛城市，甚至隔壁蹛啥人都毋知。", en: "In town you may not even know who lives next door."}
