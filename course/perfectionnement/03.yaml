    - {tailo: "Guā-kháu ê mi̍h-kiānn khah kiâm khah iû, lí ài ___.", hanji: "外口的物件較鹹較油，你愛___。", answer: "tiunn-tî", answer_hanji: "張持", en: "Food from outside is saltier and greasier, so be careful."}
    - {tailo: "Guán nn̄g ê lāu--ê lóng tsin ___.", hanji: "阮兩个老的攏真___。", answer: "ióng-kiānn", answer_hanji: "勇健", en: "We two old folk are both hale and hearty."}
    - {tailo: "Kiò guá mài siunn ___.", hanji: "叫我莫傷___。", answer: "khuà-sim", answer_hanji: "掛心", en: "He tells me not to fret so much."}
    - {tailo: "Ke-kang ta̍k-kang thàu-tsá tī thang-á guā-kháu ___.", hanji: "雞公逐工透早佇窗仔外口___。", answer: "thî", answer_hanji: "啼", en: "The rooster crows outside the window every morning."}
    - {tailo: "A-bîng kah Bí-lîng ê ___ í-king kíng hó--ah.", hanji: "阿明佮美玲的___已經揀好矣。", answer: "hó-ji̍t", answer_hanji: "好日", en: "A-bîng and Bí-lîng have chosen their wedding day."}
