    - {tailo: "Tī pak-pōo, ū tsi̍t uī bo̍k-su siōng tshut-miâ--ê sī kā lâng bán tshuì-khí.", hanji: "佇北部，有一位牧師上出名的是共人挽喙齒。", en: "In the north, one missionary was best known for pulling people's teeth."}
    - {tailo: "Tsit kuá bûn-hiàn, tsit-má sī gián-kiù Tâi-gí ê pó-puè.", hanji: "這寡文獻，這馬是研究台語的寶貝。", en: "These documents are now a treasure for anyone studying Taigi."}
    - {tailo: "Lí nā o̍h ē-hiáu Tâi-lô, khuànn Pe̍h-uē-jī ê kóo-tsheh mā bē huì-khì.", hanji: "你若學會曉 Tâi-lô，看白話字的古冊嘛袂費氣。", en: "Once you've learnt Tâi-lô, old books in Pe̍h-uē-jī won't give you much trouble."}
    - {tailo: "Tsit pún sió-suat sī īng Pe̍h-uē-jī siá--ê.", hanji: "這本小說是用白話字寫的。", en: "This novel is written in Pe̍h-uē-jī."}
    - {tailo: "Guán a-tsóo hit-sî sī tshenn-mê-gû, m̄ bat jī.", hanji: "阮阿祖彼時是青盲牛，毋捌字。", en: "Back then my great-grandmother was illiterate; she couldn't read."}
