exercises:
  translate:
    - {tailo: "Nā guá bô tńg--khì, guán tau ê tshân tō beh hng--khì--ah.", hanji: "若我無轉去，阮兜的田就欲荒去矣。", en: "If I didn't go back, our family's land would go to waste."}
    - {tailo: "Guá bô iōng huà-ha̍k puî-liāu, mā bô phùn lông-io̍h.", hanji: "我無用化學肥料，嘛無噴農藥。", en: "I don't use chemical fertiliser and I don't spray pesticides."}
    - {tailo: "Guá tshī tsi̍t tīn ah-bó tī tshân--lí.", hanji: "我飼一陣鴨母佇田裡。", en: "I keep a flock of ducks in the paddies."}
    - {tailo: "Tsoh-tshân m̄ sī lōng-bān ê tāi-tsì.", hanji: "作田毋是浪漫的代誌。", en: "Farming isn't romantic."}
    - {tailo: "Thóo-tē bē phiàn--lâng.", hanji: "土地袂騙人。", en: "The land doesn't lie."}
    - {tailo: "Bîng-tsì tī tshân--lí tshī ah-bó, ah-bó tsia̍h tsháu, tsia̍h thâng, tshân-hn̂g tō bián phùn lông-io̍h, ah-bó ê sái koh ē-tàng tsò puî-liāu.", hanji: "明志佇田裡飼鴨母，鴨母食草、食蟲，田園就免噴農藥，鴨母的屎閣會當做肥料。", en: "Bîng-tsì keeps ducks in his paddies; they eat the weeds and insects, so he doesn't need to spray pesticides; and their droppings make fertiliser."}
