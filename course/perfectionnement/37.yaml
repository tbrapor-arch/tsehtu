    - {tailo: "Tsuí-huì, tiān-huì iû tsoo tshù ê lâng pún-sin hū-tsik.", hanji: "水費、電費由租厝的人本身負責。", en: "Water and electricity are the tenants' own responsibility."}
    - {tailo: "Tshù-lāi it-khài bē-sái tsia̍h-hun.", hanji: "厝內一概袂使食薰。", en: "No smoking anywhere in the flat."}
