    - {tailo: "Lí ê bûn-tsiong siá liáu tsin hó, ē-sái khì ___--ah.", hanji: "你的文章寫了真好，會使去___矣。", answer: "tâu-kó", answer_hanji: "投稿", en: "Your essay is very good: you can submit it now."}
    - {tailo: "Siá-tshut pîng-huân sing-ua̍h ê ___.", hanji: "寫出平凡生活的___。", answer: "sè-tsiat", answer_hanji: "細節", en: "It catches the details of ordinary life."}
    - {tailo: "Kî-si̍t sī ___.", hanji: "其實是___。", answer: "tò-píng", answer_hanji: "倒反", en: "In fact it's the other way round."}
    - {tailo: "Lāu-su kóng, siá bûn-tsiong ài ___ ka-kī ê kám-tsîng, m̄-thang kan-na tsiàu tsheh siá, ài siá ka-kī khuànn--tio̍h ê tāi-tsì.", hanji: "老師講，寫文章愛___家己的感情，毋通干焦照冊寫，愛寫家己看著的代誌。", answer: "huat-hui", answer_hanji: "發揮", en: "The teacher says that when you write you should give free rein to your own feelings, not just copy from books: write about what you've seen yourself."}
