exercises:
  translate:
    - {tailo: "Guá kám-kak tsin kong-îng, mā tsin îng-hīng.", hanji: "我感覺真光榮，嘛真榮幸。", en: "It's a great honour and a privilege."}
    - {tailo: "Guá ê lîng-kám tō sī uì hia lâi--ê.", hanji: "我的靈感就是對遐來的。", en: "That's where my inspiration came from."}
    - {tailo: "Siá tsit phinn bûn-tsiong, guá siu-kái tshit pái.", hanji: "寫這篇文章，我修改七擺。", en: "I revised this essay seven times."}
    - {tailo: "Siōng hó ê tê-bo̍k, lóng tī lán ê sin-khu-pinn.", hanji: "上好的題目，攏佇咱的身軀邊。", en: "The best subjects are all around us."}
    - {tailo: "Tsióng-kim gōo-tshing khoo, guá beh iōng lâi bé tsheh.", hanji: "獎金五千箍，我欲用來買冊。", en: "The prize money is five thousand dollars: I'll spend it on books."}
    - {tailo: "Hūi-hūi kóng, i ê lîng-kám lóng sī uì pîng-huân ê sè-tsiat lâi--ê, siá liáu koh siu-kái tsin tsē pái.", hanji: "惠惠講，伊的靈感攏是對平凡的細節來的，寫了閣修改真濟擺。", en: "Hūi-hūi says her inspiration all comes from ordinary details, and that she revised what she wrote many times."}
    - {tailo: "Thâu-tsióng ū tsi̍t tiunn tsióng-tsn̄g kah tsióng-kim, Hūi-hūi beh tshiánn a-má tsia̍h tànn-á-mī, tshun--ê beh the̍h khì bé tsheh.", hanji: "頭獎有一張獎狀佮獎金，惠惠欲請阿媽食擔仔麵，賰的欲提去買冊。", en: "First prize came with a certificate and prize money, and Hūi-hūi is going to treat her grandmother to tànn-á noodles and spend the rest on books."}
