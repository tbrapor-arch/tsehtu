    - {tailo: "Kin-á-ji̍t Lo̍k-káng iáu ū tsin tsē iû-kheh, in lâi khuànn kóo-tsá ê ke-lōo, koh bé sai-hū tshiú-kang tsò ê suànn-hiunn kah sik ê mi̍h-kiānn.", hanji: "今仔日鹿港猶有真濟遊客，𪜶來看古早的街路，閣買師傅手工做的線香佮錫的物件。", en: "Lukang still draws lots of visitors today: they come to see the old streets and buy handmade incense sticks and tinware."}
