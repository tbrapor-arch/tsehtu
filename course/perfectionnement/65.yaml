    - {tailo: "Sin-lông ê a-bú ài kā tshiú-tsí thò--ji̍p-khì sin-niû ê ___.", hanji: "新郎的阿母愛共手指套入去新娘的___。", answer: "tiong-tsáinn", answer_hanji: "中指", en: "The groom's mother slips the ring onto the bride's middle finger."}
    - {tailo: "Tīng-hun iōng sap-bûn? Guán N̂g--ka kám m̄ sī beh ___!", hanji: "訂婚用雪文？阮黃家敢毋是欲___！", answer: "lo̍h-tâi", answer_hanji: "落台", en: "Soap at an engagement? The N̂g family will be a laughing stock!"}
    - {tailo: "Tshiú-tsí thò kah bué--ah, tsit-má ___ bē tshut--lâi.", hanji: "手指套甲尾矣，這馬___袂出來。", answer: "pue̍h", answer_hanji: "拔", en: "The ring has gone all the way down, and now it won't come off."}
    - {tailo: "Siù-lân ê sió-tī tī pinn--á ___, i ê a-bú kóng nā koh án-ne tō beh kā i phah-tshénn.", hanji: "秀蘭的小弟佇邊仔___，伊的阿母講若閣按呢就欲共伊拍醒。", answer: "luān-kóng", answer_hanji: "亂講", en: "Siù-lân's brother was talking nonsense at the side, and their mother said she'd knock some sense into him if he kept it up."}
