    - {tailo: "Kin-á-ji̍t ê lé-gî tsi̍t hāng to bē-sái làu-kau.", hanji: "今仔日的禮儀一項都袂使落勾。", en: "Not a single part of today's ceremony may be left out."}
    - {tailo: "Lí mài luān-kóng!", hanji: "你莫亂講！", en: "Stop talking nonsense!"}
    - {tailo: "Tshiú-tsí tì ē ji̍p tō hó; iōng siánn-mih thò--ji̍p-khì, bô lâng ē kì-tit.", hanji: "手指戴會入就好，用啥物套入去，無人會記得。", en: "What matters is that the ring goes on: nobody remembers how."}
    - {tailo: "Guá lún, guá huann-hí lún.", hanji: "我忍，我歡喜忍。", en: "I'll put up with it, happily."}
    - {tailo: "Tīng-hun hit kang, sin-niû ài hōng-tê hōo lâng-kheh lim, lâng-kheh lim liáu tō kā âng-pau khǹg tī tê-au lāi.", hanji: "訂婚彼工，新娘愛奉茶予人客啉，人客啉了就共紅包囥佇茶甌內。", en: "On the day of the engagement the bride serves tea to the guests, who put red envelopes in their cups when they've drunk it."}
    - {tailo: "Tshiú-tsí siunn sè thò bē ji̍p, A-ióng the̍h sap-bûn lâi buah, tuā-koo kóng án-ne N̂g--ka ē lo̍h-tâi.", hanji: "手指傷細套袂入，阿勇提雪文來抹，大姑講按呢黃家會落台。", en: "The ring was too small to go on, so A-ióng brought soap to rub on, and the aunt said the N̂g family would lose face."}
