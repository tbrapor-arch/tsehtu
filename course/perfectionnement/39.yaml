exercises:
  translate:
    - {tailo: "Se-i khuànn pēnn, tiong-i khuànn lâng.", hanji: "西醫看病，中醫看人。", en: "Western medicine looks at the disease; Chinese medicine looks at the person."}
    - {tailo: "Nā-sī kip-pēnn, ài kín khì pēnn-īnn.", hanji: "若是急病，愛緊去病院。", en: "For an emergency you must hurry to hospital."}
    - {tailo: "Tshiú tshun--tshut-lâi, guá sing kā lí bong me̍h.", hanji: "手伸出來，我先共你摸脈。", en: "Hold out your hand, I'll take your pulse first."}
    - {tailo: "Lí the̍h io̍h-hng khì thiah-io̍h-á.", hanji: "你提藥方去拆藥仔。", en: "Take the prescription to the herbalist's to have it made up."}
    - {tailo: "Ī-hông pí tī-liâu khah iàu-kín.", hanji: "預防比治療較要緊。", en: "Prevention matters more than cure."}
    - {tailo: "Tiong-i kóng, tsia̍h siunn tsē bah ē khí hué-khì, ài tsia̍h khóo-kue, tang-kue, lim tshenn-tsháu thè-hué.", hanji: "中醫講，食傷濟肉會起火氣，愛食苦瓜、冬瓜，啉青草退火。", en: "Chinese doctors say eating too much meat makes you overheated: you should eat bitter melon and winter melon, and drink herbal tea to cool down."}
    - {tailo: "Guán a-kong muí tsi̍t ê pēnn-lâng lóng ài bong me̍h, koh tsiàu pēnn-lâng ê tsîng-hîng khui io̍h-hng.", hanji: "阮阿公每一个病人攏愛摸脈，閣照病人的情形開藥方。", en: "My grandfather takes every patient's pulse and writes the prescription according to their condition."}
  fill:
    - {tailo: "Tshenn-tsháu tê tsin ___.", hanji: "青草茶真___。", answer: "thè-hué", answer_hanji: "退火", en: "Herbal tea really cools you down."}
    - {tailo: "Kha-ba̍k ê pōo-hūn, guá kā lí ___ nn̄g pái.", hanji: "跤目的部份，我共你___兩擺。", answer: "tsiam-kù", answer_hanji: "針灸", en: "As for the ankle, I'll give you two sessions of acupuncture."}
    - {tailo: "Lí ū tsóo-thuân ê ___--bô?", hanji: "你有祖傳的___無？", answer: "pì-hng", answer_hanji: "祕方", en: "Do you have a secret family remedy?"}
    - {tailo: "Tiong-i ū lí-lūn, mā ū kuí-tshing nî ê ___.", hanji: "中醫有理論，嘛有幾千年的___。", answer: "king-giām", answer_hanji: "經驗", en: "Chinese medicine has its theory and thousands of years of experience."}
    - {tailo: "Lí ê sin-thé ài hó-hó-á ___.", hanji: "你的身體愛好好仔___。", answer: "tiâu-ióng", answer_hanji: "調養", en: "You need to take good care of your health."}
    - {tailo: "Tsit thiap io̍h ài iōng sann uánn tsuí ___ tsò tsi̍t uánn, lim liáu tō khì khùn.", hanji: "這帖藥愛用三碗水___做一碗，啉了就去睏。", answer: "tsuann", answer_hanji: "煎", en: "This dose has to be brewed down from three bowls of water to one; drink it and go to bed."}
