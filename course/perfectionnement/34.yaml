    - {tailo: "I sing mn̄g ta̍k-ke ê kháu-king, m̄-koh bô puànn hāng suànn-soh.", hanji: "伊先問逐家的口供，毋過無半項線索。", en: "First he took everyone's statements, but there wasn't a single clue."}
