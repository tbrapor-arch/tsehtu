    - {tailo: "Huān-lâng tshuē--tio̍h--ah, m̄-koh i bô jīn-tsuē.", hanji: "犯人揣著矣，毋過伊無認罪。", en: "The culprit had been found, but he didn't confess."}
    - {tailo: "Lîm peh--á khah-tsá sī hîng-sū, i àm-tiong kuan-tshat sann mê, tsiah huat-kak huān-lâng sī tsi̍t tsiah niau.", hanji: "林伯仔較早是刑事，伊暗中觀察三暝，才發覺犯人是一隻貓。", en: "Uncle Lîm used to be a detective: he watched in secret for three nights before discovering the culprit was a cat."}
    - {tailo: "Tāi-tsì iáu-buē tshâ tshing-tshó, mài lia̍h-tsò ka-kī tsai-iánn, phuànn-tuàn tshò-gōo ē uan-óng--lâng.", hanji: "代誌猶未查清楚，莫掠做家己知影，判斷錯誤會冤枉人。", en: "Until you've got to the bottom of it, don't assume you know: a wrong judgment can wrong an innocent person."}
