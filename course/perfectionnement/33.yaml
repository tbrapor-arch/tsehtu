    - {tailo: "Tshit tiám sîn-kiō tshut biō, Ông-iâ beh ___.", hanji: "七點神轎出廟，王爺欲___。", answer: "jiàu-kíng", answer_hanji: "繞境", en: "At seven the sedan chair leaves the temple, and the Royal Lord will process round the village."}
