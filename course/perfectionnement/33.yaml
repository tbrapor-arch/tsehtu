    - {tailo: "Siánn-lâng ū ___ tsò uí-uân, lóng sī kong-khai tâu-phiò kuat-tīng.", hanji: "啥人有___做委員，攏是公開投票決定。", answer: "tsu-keh", answer_hanji: "資格", en: "Who is qualified to sit on the committee is decided by an open vote."}
    - {tailo: "Tsit-má sī hó ___, tsìng-hú mā ū póo-tsōo.", hanji: "這馬是好___，政府嘛有補助。", answer: "sî-ki", answer_hanji: "時機", en: "Now's the right moment: the government is giving grants too."}
    - {tailo: "Guân-siau ê ___, sī tsóo-sian lâu--lo̍h-lâi ê kong-tshái.", hanji: "元宵的___，是祖先留落來的光彩。", answer: "hong-sio̍k", answer_hanji: "風俗", en: "The customs of the Lantern Festival are a glory our ancestors left us."}
    - {tailo: "Tsit-má sī hó sî-ki, lán tō ài ___ kā kong-hn̂g kah tha̍k-tsheh ê sóo-tsāi tsò hōo hó.", hanji: "這馬是好時機，咱就愛___共公園佮讀冊的所在做予好。", answer: "hia̍p-li̍k", answer_hanji: "協力", en: "Now's the right moment: we must work together to make the park and the reading room a success."}
