exercises:
  translate:
    - {tailo: "Guán a-pah khuànn--khí-lâi tsin giâm, kî-si̍t sim-sìng tsin hó.", hanji: "阮阿爸看起來真嚴，其實心性真好。", en: "My dad looks stern, but he's really kind at heart."}
    - {tailo: "Thâu-pái lâi pài-hóng, kiáu-jiáu lín--ah.", hanji: "頭擺來拜訪，攪擾恁矣。", en: "It's my first visit, sorry to impose on you."}
    - {tailo: "Bián án-ne-senn, bián khu-sok.", hanji: "免按呢生，免拘束。", en: "No need for all that, relax."}
    - {tailo: "Hó-gia̍h m̄ sī siōng iàu-kín--ê, sim-sìng khah iàu-kín.", hanji: "好額毋是上要緊的，心性較要緊。", en: "Money isn't what matters most: character matters more."}
    - {tailo: "Lí nā the-sî, guán a-pah ē bô huann-hí.", hanji: "你若推辭，阮阿爸會無歡喜。", en: "If you refuse, my dad will be offended."}
    - {tailo: "Thâu-pái khì lâng tau pài-hóng, ài the̍h lé-a̍p, koh ài kóng “kiáu-jiáu--lín--ah”.", hanji: "頭擺去人兜拜訪，愛提禮盒，閣愛講「攪擾恁矣」。", en: "The first time you visit someone's home, you should bring a gift box and say 'sorry to impose on you'."}
    - {tailo: "Siù-lân ê a-pah thîn tsiú kìng Sam, Sam m̄-kánn the-sî, lim liáu bīn suî âng--khí-lâi.", hanji: "秀蘭的阿爸斟酒敬Sam，Sam毋敢推辭，啉了面隨紅起來。", en: "Siù-lân's father poured a drink and toasted Sam; Sam didn't dare refuse, and went red as soon as he drank it."}
  fill:
