    - {tailo: "Lí ê tsu-sè bô tsìng-khak.", hanji: "你的姿勢無正確。", en: "Your posture isn't right."}
    - {tailo: "Tsáu-pio ê sî, nā ē-tàng kóng-uē, sok-tōo tō tú-hó.", hanji: "走標的時，若會當講話，速度就拄好。", en: "When you run, if you can still talk, the pace is right."}
    - {tailo: "Ê nā bô hó, kha-ba̍k tō iông-ī láu--tio̍h.", hanji: "鞋若無好，跤目就容易扭著。", en: "If your shoes aren't good, you twist your ankle easily."}
    - {tailo: "Ē-sái--ah, lán kau-uānn tiān-uē.", hanji: "會使啊，咱交換電話。", en: "Sure, let's swap numbers."}
    - {tailo: "Pîng-siông-sî guá ài tsò kang, kan-na lé-pài-la̍k ē-tàng tī hô-pinn tsáu, hit-tsūn sǹg-sī khah tshing-îng.", hanji: "平常時我愛做工，干焦禮拜六會當佇河邊走，彼陣算是較清閒。", en: "During the week I work; only on Saturdays can I run by the river, and that's when I have a bit more free time."}
    - {tailo: "Buē tsáu-pio í-tsîng ài sing tshun-kha, koh kā io-kut ngiú hōo khui, tsiah bē khì phah-pháinn kha-ba̍k.", hanji: "未走標以前愛先伸跤，閣共腰骨扭予開，才袂去拍歹跤目。", en: "Before a race you should stretch your legs and loosen up your back, so you don't injure your ankle."}
