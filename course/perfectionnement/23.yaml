    - {tailo: "Kiau-ngōo ê lâng, tsá-bān ē su.", hanji: "驕傲的人，早慢會輸。", en: "The arrogant lose, sooner or later."}
    - {tailo: "Oo-a thiann kah tsiok tik-ì.", hanji: "烏鴉聽甲足得意。", en: "The crow was thrilled to hear it."}
    - {tailo: "M̄-thang thí-tshiò--lâng.", hanji: "毋通恥笑人。", en: "Don't make fun of people."}
    - {tailo: "Hit tsiah hôo-lî tsin kan-khiáu, i iōng tinn-giân-bi̍t-gí kā oo-a o-ló, oo-a tsi̍t khui tshuì, bah tō lo̍h-thôo--ah.", hanji: "彼隻狐狸真奸巧，伊用甜言蜜語共烏鴉呵咾，烏鴉一開喙，肉就落塗矣。", en: "That fox was very sly: he sweet-talked the crow, and the moment the crow opened her beak, the meat fell to the ground."}
    - {tailo: "Thòo-á tsáu kah tsiok kín, m̄-koh i siunn tik-ì, tsáu kàu puànn-lōo tō khì khùn-tàu, tsá-bān ē su.", hanji: "兔仔走甲足緊，毋過伊傷得意，走到半路就去睏晝，早慢會輸。", en: "The hare ran very fast, but he was too pleased with himself: he took a nap halfway, and was bound to lose sooner or later."}
