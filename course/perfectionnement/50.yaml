exercises:
  translate:
    - {tailo: "Guá ê tuì-tshiú tsin gâu kóng-uē, m̄-koh guá khah ài iōng hîng-tōng.", hanji: "我的對手真𠢕講話，毋過我較愛用行動。", en: "My opponent is a great talker, but I prefer action."}
    - {tailo: "Ha̍k-sing-huē ê king-huì ài thàu-bîng.", hanji: "學生會的經費愛透明。", en: "The student council's budget must be transparent."}
    - {tailo: "Muí tsi̍t ê tông-ha̍k lóng sī pîng-tíng--ê.", hanji: "每一个同學攏是平等的。", en: "Every student is equal."}
    - {tailo: "Suán-phiò sī sîn-sìng--ê.", hanji: "選票是神聖的。", en: "Your vote is sacred."}
    - {tailo: "Guá ē tsīn-li̍k, si̍t-hiān guá kóng ê muí tsi̍t hāng.", hanji: "我會盡力，實現我講的每一項。", en: "I'll do my utmost to deliver every single thing I've promised."}
    - {tailo: "Hūi-hūi kóng, nā i tòng-suán, i ē tīng-kî kā ha̍k-sing-huē ê king-huì kong-khai, hōo ta̍k-ke lâi kàm-tok.", hanji: "惠惠講，若伊當選，伊會定期共學生會的經費公開，予逐家來監督。", en: "Hūi-hūi says that if she's elected she'll regularly make the council's budget public so everyone can keep an eye on it."}
    - {tailo: "Tsò huē-tiúnn ài guān-ì sîng-tam tsik-jīm, m̄-thang kan-na kóng, ài iōng hîng-tōng si̍t-hiān tsìng-kiàn.", hanji: "做會長愛願意承擔責任，毋通干焦講，愛用行動實現政見。", en: "A president must be willing to take on responsibility: not just talk, but carry out the programme through action."}
  fill:
    - {tailo: "Guá kiàn-gī ha̍k-hāu ___ ka-kī kíng tshài ê hong-sik.", hanji: "我建議學校___家己揀菜的方式。", answer: "tshái-iōng", answer_hanji: "採用", en: "I suggest the school lets us choose our own dishes."}
    - {tailo: "Guá ē tīng-kî tī bāng-lōo tíng suat-bîng ha̍k-sing-huē ê ___.", hanji: "我會定期佇網路頂說明學生會的___。", answer: "tsōng-hóng", answer_hanji: "狀況", en: "I'll regularly report online on how the council is doing."}
    - {tailo: "Sī khuànn lí guān-ì ___ tsik-jīm--bô.", hanji: "是看你願意___責任無。", answer: "sîng-tam", answer_hanji: "承擔", en: "It's about whether you're willing to take on the responsibility."}
    - {tailo: "Nā guá ___, guá ē kiong-hí A-kia̍t.", hanji: "若我___，我會恭喜阿傑。", answer: "lo̍k-suán", answer_hanji: "落選", en: "If I lose, I'll congratulate A-kia̍t."}
    - {tailo: "Guá ___ ê kháu-hō sī: “Kóng kàu, tsò kàu.”", hanji: "我___的口號是：「講到，做到。」", answer: "kīng-suán", answer_hanji: "競選", en: "My campaign slogan is: 'What I say, I do.'"}
    - {tailo: "A-kia̍t tī hāu-mn̂g pài-phiò, pun thn̂g-á hōo ta̍k-ke, m̄-koh ū lâng kóng ___ m̄-thang uī-tio̍h thn̂g-á tō tâu.", hanji: "阿傑佇校門拜票，分糖仔予逐家，毋過有人講___毋通為著糖仔就投。", answer: "suán-phiò", answer_hanji: "選票", en: "A-kia̍t canvassed at the school gate and handed out sweets, but someone said you shouldn't cast your vote for a sweet."}
