exercises:
  translate:
    - {tailo: "Nn̄g tsióng kóng-huat pênn-pênn sī Tâi-gí.", hanji: "兩種講法平平是台語。", en: "Both ways of saying it are just as much Taigi."}
    - {tailo: "A-peh ē kui-khì tshuā lí khì.", hanji: "阿伯會規氣𤆬你去。", en: "The old man will simply take you there himself."}
    - {tailo: "Pài-la̍k nā ū-îng, lán sio-tsio khì Pak-tâu sé un-tsuânn.", hanji: "拜六若有閒，咱相招去北投洗溫泉。", en: "If you're free on Saturday, let's all go to the hot springs in Beitou."}
  fill:
    - {tailo: "Lí mài tī hia ___.", hanji: "你莫佇遐___。", answer: "phòng-hong", answer_hanji: "膨風", en: "Stop showing off."}
    - {tailo: "Guá tńg--lâi Tâi-pak liáu-āu, kám-kak tsiânn ___.", hanji: "我轉來臺北了後，感覺誠___。", answer: "hi-bî", answer_hanji: "稀微", en: "Since I came back to Taipei I've felt rather lonely."}
