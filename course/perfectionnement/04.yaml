    - {tailo: "Báng-á kui-tīn pue--lâi, ___ kah guán kui-sin-khu lóng sī.", hanji: "蠓仔規陣飛來，___甲阮規身軀攏是。", answer: "tìng", answer_hanji: "叮", en: "The mosquitoes came in swarms and bit us all over."}
    - {tailo: "Guán hāu-senn kin-nî tsa̍p huè, i ___ hué-kim-koo sī kòo-sū-tsheh lāi-té tsiah ū ê.", hanji: "阮後生今年十歲，伊___火金蛄是故事冊內底才有的。", answer: "kiò-sī", answer_hanji: "叫是", en: "My son is ten this year, and he thought fireflies only existed in storybooks."}
    - {tailo: "Ji̍t-thâu ___, tuā-lâng lóng tī tshiū-á-kha hioh-khùn.", hanji: "日頭___，大人攏佇樹仔跤歇睏。", answer: "tshiah-iānn-iānn", answer_hanji: "赤焱焱", en: "With the sun blazing, the grown-ups rested under the trees."}
    - {tailo: "Guá ê hong-tshue hōo hong tshue kah tn̄g--khì, guá tsáu khì ___.", hanji: "我的風吹予風吹甲斷去，我走去___。", answer: "jiok", answer_hanji: "逐", en: "The wind snapped my kite's string, and I ran after it."}
