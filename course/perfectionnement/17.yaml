exercises:
  translate:
    - {tailo: "Guá sann-tsa̍p-jī huè--ah, iáu-sī tuann-sin.", hanji: "我三十二歲矣，猶是單身。", en: "I'm thirty-two and still single."}
    - {tailo: "Khui-tshuì tō hau-siâu, tsit pái ún-sí--ê.", hanji: "開喙就嘐潲，這擺穩死的。", en: "He opens his mouth and starts bragging. He's done for this time."}
    - {tailo: "I bîng-bîng kah guá kāng-khuán sī sió tsit-uân.", hanji: "伊明明佮我仝款是小職員。", en: "He's clearly a junior employee, same as me."}
