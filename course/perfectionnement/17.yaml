    - {tailo: "Āu lé-pài lán koh siong-huē.", hanji: "後禮拜咱閣相會。", en: "Let's meet again the week after next."}
    - {tailo: "Guán a-hiann sī tiān-náu kang-tîng-su.", hanji: "阮阿兄是電腦工程師。", en: "My older brother is a computer engineer."}
    - {tailo: "I bîng-bîng tsai-iánn, koh ké-iánn m̄ tsai.", hanji: "伊明明知影，閣假影毋知。", en: "He clearly knows, but pretends he doesn't."}
