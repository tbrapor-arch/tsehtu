exercises:
  translate:
    - {tailo: "Tsit tsiah kâu-san--á tsin khiáu, koh tsin tuā-tánn.", hanji: "這隻猴山仔真巧，閣真大膽。", en: "This monkey was clever and bold."}
    - {tailo: "I pài tsi̍t ê sian-jîn tsò su-hū, o̍h-tio̍h piàn-huà ê huat-su̍t.", hanji: "伊拜一个仙人做師父，學著變化的法術。", en: "He took an immortal as his master and learnt the magic of transformation."}
    - {tailo: "Guá sī hó-hàn, ná ē kā thian-tîng kòo bé?", hanji: "我是好漢，哪會共天庭顧馬？", en: "I'm a hero! Why should I mind heaven's horses?"}
    - {tailo: "Lí nā ē-tàng thiàu tshut guá ê tshiú-tê-á, thian-tîng tō hōo lí tsē.", hanji: "你若會當跳出我的手蹄仔，天庭就予你坐。", en: "If you can jump out of the palm of my hand, heaven's throne is yours."}
    - {tailo: "M̄-koh, he sī līng-guā tsi̍t ê kòo-sū--ah.", hanji: "毋過，彼是另外一个故事矣。", en: "But that's another story."}
    - {tailo: "Sun Ngōo-khong kā i ê su-hū o̍h-tio̍h piàn-huà ê huat-su̍t, bú-gē jú lâi jú lī-hāi, lâng mā jú lâi jú hiau-pai, liân Gio̍k-hông-tāi-tè to bô khuànn tī ba̍k-tsiu lāi.", hanji: "孫悟空共伊的師父學著變化的法術，武藝愈來愈厲害，人嘛愈來愈囂俳，連玉皇大帝都無看佇目睭內。", en: "Sun Ngōo-khong learnt the magic of transformation from his master; his fighting skills grew and so did his arrogance, until even the Jade Emperor meant nothing to him."}
    - {tailo: "Thian-tîng khui iàn-huē bô tshiánn--i, i tō iōng huat-su̍t hōo tsìng-lâng khùn--khì, thau tsia̍h sian-thô kah sian-tan, koh tī thian-tîng sì-kè pàng-hué.", hanji: "天庭開宴會無請伊，伊就用法術予眾人睏去，偷食仙桃佮仙丹，閣佇天庭四界放火。", en: "Heaven held a banquet without inviting him, so he put everyone to sleep with a spell, stole the peaches and the elixir, and set fires all over heaven."}
  fill:
    - {tailo: "Guá ē-tàng iōng hó-uē kā i siu--lo̍h-lâi, tō lo̍h ___, kiò i tsiūnn thian-tîng tsò kuann.", hanji: "我會當用好話共伊收落來，就落___，叫伊上天庭做官。", answer: "sìng-tsí", answer_hanji: "聖旨", en: "I can win him over with kind words: I'll issue a decree inviting him up to heaven to take a post."}
    - {tailo: "Sun Ngōo-khong sī ___, kiàn-nā khuànn-tio̍h si̍k--ê, tō bán lâi tsia̍h.", hanji: "孫悟空是___，見若看著熟的，就挽來食。", answer: "iau-kuí", answer_hanji: "枵鬼", en: "Sun Ngōo-khong was a glutton, and whenever he saw a ripe one he picked it and ate it."}
    - {tailo: "Thian-ping hōo i hì-lāng kah ___.", hanji: "天兵予伊戲弄甲___。", answer: "bô-puànn-pōo", answer_hanji: "無半步", en: "He made fools of heaven's soldiers."}
    - {tailo: "Tsí-hó tshiánn Jû-lâi Pu̍t-tsóo lâi tsò ___.", hanji: "只好請如來佛祖來做___。", answer: "kiù-ping", answer_hanji: "救兵", en: "He had to call on the Buddha to come to the rescue."}
    - {tailo: "Sun Ngōo-khong tī suann-kha ap gōo-pah tang, ___ kah bô lâng mn̄g.", hanji: "孫悟空佇山跤壓五百冬，___甲無人問。", answer: "lo̍h-lān", answer_hanji: "落難", en: "Sun Ngōo-khong lay under the mountain for five hundred years, fallen so low that no one cared."}
    - {tailo: "Jû-lâi ê tshiú tsi̍t-ē píng, tō piàn-tsò tsi̍t lia̍p tuā suann, kā Sun Ngōo-khong ___ tī suann-kha, i tō án-ne tī hia lo̍h-lān gōo-pah tang.", hanji: "如來的手一下反，就變做一粒大山，共孫悟空___佇山跤，伊就按呢佇遐落難五百冬。", answer: "ap", answer_hanji: "壓", en: "The Buddha turned his hand over and it became a great mountain, pinning Sun Ngōo-khong beneath it, and there he languished for five hundred years."}
