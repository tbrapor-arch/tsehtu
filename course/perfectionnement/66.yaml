    - {tailo: "M̄-thang iōng pháinn tshiú-tuānn, m̄-thang ___ pa̍t-lâng.", hanji: "毋通用歹手段，毋通___別人。", answer: "lī-iōng", answer_hanji: "利用", en: "Never use dirty tricks or take advantage of others."}
    - {tailo: "Ka-tîng ê ___ ài hô-pîng.", hanji: "家庭的___愛和平。", answer: "khì-hun", answer_hanji: "氣氛", en: "Keep the atmosphere at home peaceful."}
    - {tailo: "Ài-tsîng m̄ sī siánn-mih ___ ê tāi-tsì.", hanji: "愛情毋是啥物___的代誌。", answer: "uí-tāi", answer_hanji: "偉大", en: "Love isn't some grand thing."}
    - {tailo: "Lâng nā bô ē-hiáu ___, tō ē hōo io̍k-bōng thua leh tsáu, siánn-mih liû-hîng to beh tuè, tsînn khai liáu-liáu mā bē huann-hí.", hanji: "人若無會曉___，就會予欲望拖咧走，啥物流行都欲綴，錢開了了嘛袂歡喜。", answer: "buán-tsiok", answer_hanji: "滿足", en: "If you don't know how to be content, your desires drag you along and you chase every fashion, spending all your money and still not happy."}
