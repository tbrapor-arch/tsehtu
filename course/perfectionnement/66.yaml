    - {tailo: "Ang-bóo sī hōo-siong uá-khò, m̄ sī hōo-siong sok-pa̍k.", hanji: "翁某是互相倚靠，毋是互相束縛。", en: "Husband and wife lean on each other; they don't tie each other down."}
    - {tailo: "Tsò-lâng siōng iàu-kín--ê, sī siān-liông, ū tsû-pi-sim.", hanji: "做人上要緊的，是善良、有慈悲心。", en: "What matters most in life is to be kind and compassionate."}
    - {tailo: "Jîn-keh pí tsînn khah tāng.", hanji: "人格比錢較重。", en: "Character weighs more than money."}
    - {tailo: "Lâng ài ē-hiáu buán-tsiok.", hanji: "人愛會曉滿足。", en: "You have to know how to be content."}
    - {tailo: "A-kong kóng, ang-bóo ê bô-kāng sī lân-bián--ê, m̄-koh nā ē-hiáu tsiap-la̍p tuì-hong, kám-tsîng tō ē kian-kòo.", hanji: "阿公講，翁某的無仝是難免的，毋過若會曉接納對方，感情就會堅固。", en: "Grandad says differences between husband and wife are inevitable, but if you know how to accept each other, your love will be strong."}
    - {tailo: "Kun-tsú siú tō-tik, m̄ ē iōng pháinn tshiú-tuānn lī-iōng pa̍t-lâng, siáu-jîn tsiah ē tâu-ki thàn tsi̍t-sî ê tsînn.", hanji: "君子守道德，毋會用歹手段利用別人，小人才會投機趁一時的錢。", en: "A person of integrity keeps to what's right and never uses dirty tricks to take advantage of others; only petty people speculate for quick money."}
