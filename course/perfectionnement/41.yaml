exercises:
  translate:
    - {tailo: "Kin-á-àm lí it-tshè tsiàu guá kóng--ê tsò.", hanji: "今仔暗你一切照我講的做。", en: "Tonight, do exactly as I say."}
    - {tailo: "Iā-tshī lâng tsin tsē, kheh kah bē tín-tāng.", hanji: "夜市人真濟，𤲍甲袂振動。", en: "There are so many people at the night market, you can hardly move."}
    - {tailo: "Lí ài piáu-hiān khah ū lâm-tsú khì-khài.", hanji: "你愛表現較有男子氣概。", en: "You need to look more manly."}
    - {tailo: "Guá kah-ì--ê sī lí tsit ê lâng, m̄ sī A-ióng siá ê kio̍k-pún.", hanji: "我佮意的是你這个人，毋是阿勇寫的劇本。", en: "It's you I like, not A-ióng's script."}
    - {tailo: "Sing tsia̍h ke-pâi, tán--tsi̍t-ē tsiah khan.", hanji: "先食雞排，等一下才牽。", en: "Fried chicken first: we'll hold hands afterwards."}
    - {tailo: "A-ióng tī hīnn-ki lāi-té kā Sam kóng, ài tsú-tōng tshiánn Siù-lân lim ling-tê, mài kan-na tsia̍h ke-pâi.", hanji: "阿勇佇耳機內底共Sam講，愛主動請秀蘭啉奶茶，莫干焦食雞排。", en: "Through the earphone A-ióng told Sam to take the initiative and buy Siù-lân a milk tea, not just eat chicken steak."}
    - {tailo: "Siù-lân bîng-tsai ū lâng teh kà Sam, m̄-koh i bô kóng, iáu-koh tshuì-tshiò-ba̍k-tshiò.", hanji: "秀蘭明知有人咧教Sam，毋過伊無講，猶閣喙笑目笑。", en: "Siù-lân knew full well someone was coaching Sam, but she said nothing and kept on smiling."}
  fill:
    - {tailo: "Sī āu-piah ê ke-pâi ___--lah!", hanji: "是後壁的雞排___啦！", answer: "tànn-á", answer_hanji: "擔仔", en: "That's the fried chicken stall behind us!"}
