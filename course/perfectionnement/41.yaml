    - {tailo: "Kā i kóng tsi̍t kù ū ___ ê uē.", hanji: "共伊講一句有___的話。", answer: "tsîng-ì", answer_hanji: "情意", en: "Say something romantic to her."}
    - {tailo: "Lí ê ___ guá lóng thiann--tio̍h--ah.", hanji: "你的___我攏聽著矣。", answer: "àm-hō", answer_hanji: "暗號", en: "I've heard all your secret instructions."}
    - {tailo: "Lám hîm-á, ___.", hanji: "攬熊仔，___。", answer: "tshuì-tshiò-ba̍k-tshiò", answer_hanji: "喙笑目笑", en: "Hugging the bear, grinning from ear to ear."}
    - {tailo: "Sam siā--tio̍h, the̍h tsi̍t tsiah hîm hōo Siù-lân, A-ióng kóng: \"Tse tō sī lâm-tsú ___!\"", hanji: "Sam射著，提一隻熊予秀蘭，阿勇講：「這就是男子___！」", answer: "khì-khài", answer_hanji: "氣概", en: "Sam hit the target and gave Siù-lân a teddy bear; A-ióng said: \"That's what a real man does!\""}
