    - {tailo: "Guá sio̍k hóo, i sio̍k thòo.", hanji: "我屬虎，伊屬兔。", en: "I'm a Tiger, she's a Rabbit."}
    - {tailo: "Lín tau ê tuā-mn̂g ǹg sai-pîng, hong-suí bô siánn hó.", hanji: "恁兜的大門向西爿，風水無啥好。", en: "Your front door faces west: the feng shui isn't good."}
    - {tailo: "Lâng ê miā-ūn sī tsin pháinn-kóng--ê.", hanji: "人的命運是真歹講的。", en: "A person's destiny is very hard to predict."}
    - {tailo: "Âng-pau iû-tsāi lín, suî-ì tō hó.", hanji: "紅包由在恁，隨意就好。", en: "The red envelope is up to you: whatever you like."}
    - {tailo: "Puàn-sian khuànn guán ê senn-siùnn kah peh-jī, kóng guán nn̄g ê ē ha̍h, koh kíng tsi̍t ê kiat-ji̍t.", hanji: "半仙看阮的生相佮八字，講阮兩个會合，閣揀一个吉日。", en: "The fortune teller looked at our zodiac signs and birth details, said we were compatible, and chose a lucky day."}
    - {tailo: "Siok-tsing tsin thih-khí, i kóng hong-suí kah kái-ūn lóng sī bê-sìn, m̄-koh i mā bô kā a-bú pháinn-khuànn.", hanji: "淑貞真鐵齒，伊講風水佮改運攏是迷信，毋過伊嘛無予阿母歹看。", en: "Siok-tsing doesn't believe in any of it: she says feng shui and changing your luck are superstition, but she didn't embarrass his mother."}
