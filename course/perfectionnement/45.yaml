exercises:
  translate:
    - {tailo: "Guá m̄ bat hîn-tsûn.", hanji: "我毋捌眩船。", en: "I've never been seasick."}
    - {tailo: "Káng lāi tong-jiân pênn, tshut káng liáu-āu, hong-íng tō tuā--ah.", hanji: "港內當然平，出港了後，風湧就大矣。", en: "Of course it's calm inside the harbour. Once we're out, the waves get bigger."}
    - {tailo: "Sann tsiah hái-ti tuè lán ê tsûn teh thiàu.", hanji: "三隻海豬綴咱的船咧跳。", en: "Three dolphins are leaping alongside our boat."}
    - {tailo: "Jîn-sing tshin-tshiūnn hái, ū-sî pîng-tsīng, ū-sî hong-íng.", hanji: "人生親像海，有時平靜，有時風湧。", en: "Life is like the sea: sometimes calm, sometimes stormy."}
    - {tailo: "Mài khuànn hái, khuànn hn̄g-hn̄g ê thinn-pinn.", hanji: "莫看海，看遠遠的天邊。", en: "Don't look at the water, look at the horizon in the distance."}
    - {tailo: "Thó-hái-lâng kóng, khí-hong ê sî tsûn ē iô kah tsin lī-hāi, m̄-thang tī kah-pán kiânn-lâi-kiânn-khì.", hanji: "討海人講，起風的時船會搖甲真厲害，毋通佇甲板行來行去。", en: "The fishermen say that when the wind gets up the boat rocks badly, so you mustn't walk about on deck."}
    - {tailo: "Tī tsûn-thâu ē-tàng khuànn-tio̍h thinn-pinn ê tó-sū, hái-tsuí tsin tshing, koh ū tsi̍t tīn hái-ti tuè tsûn teh iû.", hanji: "佇船頭會當看著天邊的島嶼，海水真清，閣有一陣海豬綴船咧游。", en: "From the bow you can see the islands on the horizon; the water is clear, and a pod of dolphins is swimming alongside the boat."}
