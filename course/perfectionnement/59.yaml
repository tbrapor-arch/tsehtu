    - {tailo: "Tsit khuán ___, kám ū siàu-liân-lâng beh tsiap?", hanji: "這款___，敢有少年人欲接？", answer: "thuân-sîng", answer_hanji: "傳承", en: "Are young people willing to carry on this tradition?"}
