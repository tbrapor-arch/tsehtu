  fill:
    - {tailo: "Guá tsit-má ___ kah koh ē-tàng khì suann-tíng tshò-tshâ!", hanji: "我這馬___甲閣會當去山頂剉柴！", answer: "ióng-kiānn", answer_hanji: "勇健", en: "I'm fit enough to go up the mountain and chop wood again!"}
    - {tailo: "Bí-lîng ___ suí, lâng koh hó-lé.", hanji: "美玲___媠，人閣好禮。", answer: "senn-tsò", answer_hanji: "生做", en: "Bí-lîng is pretty, and polite as well."}
    - {tailo: "Guá sī ___ lâng, kan-na tsai-iánn khîn-khiām thàn-tsia̍h.", hanji: "我是___人，干焦知影勤儉趁食。", answer: "kóo-ì", answer_hanji: "古意", en: "I was an honest fellow who only knew how to work hard and earn a living."}
    - {tailo: "Guán Tâi-pak lâng ___ ū tsiah thiànn lâng ê a-kong a-má.", hanji: "阮臺北人___有遮疼人的阿公阿媽。", answer: "hán-tit", answer_hanji: "罕得", en: "We Taipei people seldom have grandparents this loving."}
    - {tailo: "Guá iáu khiàm Sam tsi̍t ___ tsiú.", hanji: "我猶欠 Sam 一___酒。", answer: "kan", answer_hanji: "矸", en: "I still owe Sam a bottle."}
    - {tailo: "Tsit ê siunn-á siunn tāng, guá ê ___ bô kàu.", hanji: "這个箱仔傷重，我的___無夠。", answer: "khuì-la̍t", answer_hanji: "氣力", en: "This box is too heavy, I'm not strong enough."}
