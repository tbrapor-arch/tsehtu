exercises:
  translate:
    - {tailo: "Guán sió-tī khùn-bîn ê sî tsin gâu liòng-phuē, a-bú ta̍k àm lóng ài khí-lâi kā i ê phuē kah hó-sè.", hanji: "阮小弟睏眠的時真𠢕躘被，阿母逐暗攏愛起來共伊的被蓋好勢。", en: "My little brother is always kicking off the covers in his sleep, so Mum has to get up every night and tuck him back in."}
    - {tailo: "Lí kám-mōo iáu-buē hó, tshut-mn̂g ài tshīng khah sio--leh, m̄-thang koh khì guā-kháu siàn-tio̍h hong.", hanji: "你感冒猶未好，出門愛穿較燒咧，毋通閣去外口搧著風。", en: "Your cold isn't better yet. Wrap up warm when you go out, and don't go standing in the wind again."}
    - {tailo: "Hit tsiah káu tsia̍h pn̄g tsiânn kín, tsi̍t uánn bah tsi̍t-ē-á tō hōo i sut liáu-liáu--ah.", hanji: "彼隻狗食飯誠緊，一碗肉一下仔就予伊捽了了矣。", en: "That dog eats so fast. A bowl of meat was gone in a flash."}
    - {tailo: "Gín-á-lâng m̄-thang tī ke-á-lōo khian tsio̍h-thâu, nā khian-tio̍h lâng ê tshia-thang, tō mâ-huân--ah.", hanji: "囡仔人毋通佇街仔路掔石頭，若掔著人的車窗，就麻煩矣。", en: "Children mustn't throw stones in the street. Hit someone's car window and you'll be in real trouble."}
    - {tailo: "Guá ê pâng-king hōo sió-tī tshia kah luān-tshau-tshau, tsheh lóng hōo i hiat kah thôo-kha tsi̍t-sì-kè.", hanji: "我的房間予小弟捙甲亂操操，冊攏予伊㧒甲塗跤一四界。", en: "My little brother turned my room upside down and flung my books all over the floor."}
  fill:
    - {tailo: "Hong-íng tsin tuā, tsûn ___ kah tsin lī-hāi, guá kui-lōo lóng thòo kah kiōng-beh sí.", hanji: "風湧真大，船___甲真厲害，我規路攏吐甲強欲死。", answer: "hián", answer_hanji: "搟", en: "The waves were high and the boat rocked terribly. I was sick all the way and felt like dying."}
    - {tailo: "I kā a-má ê tê-au ___-tó--khì, sio-tê lâu kah kui toh, hōo a-má mē kui-poo, kóng i tsò tāi-tsì siunn bô tsù-ì.", hanji: "伊共阿媽的茶甌___倒去，燒茶流甲規桌，予阿媽罵規晡，講伊做代誌傷無注意。", answer: "tshia", answer_hanji: "捙", en: "He knocked over Grandma's teacup. Hot tea went all over the table, and Grandma told him off for ages for being so careless."}
    - {tailo: "Sè-hàn ê sî, guán tiānn-tiānn tī tshân-lí iōng siang-tshiú ___ tshân-kap-á, lia̍h-tio̍h tō pàng.", hanji: "細漢的時，阮定定佇田裡用雙手___田蛤仔，掠著就放。", answer: "hap", answer_hanji: "欱", en: "When we were small we'd often catch frogs in the fields between our cupped hands, then let them go."}
    - {tailo: "Gín-á bô kuai, a-pa siūnn-beh phah i ê kha-tshng-___, a-má kín kā i khǹg tī āu-piah.", hanji: "囡仔無乖，阿爸想欲拍伊的尻川___，阿媽緊共伊囥佇後壁。", answer: "phué", answer_hanji: "䫌", en: "The child was naughty and Dad wanted to smack his bottom, but Grandma quickly hid him behind her."}
    - {tailo: "Tsit ê gín-á pak-tóo thiànn kah tī bîn-tshn̂g-tíng phah-___, guán kín tshuā i khì khuànn kip-tsín.", hanji: "這个囡仔腹肚疼甲佇眠床頂拍___，阮緊𤆬伊去看急診。", answer: "phún", answer_hanji: "翸", en: "The child's stomach hurt so much he was rolling about on the bed, so we rushed him to the emergency room."}
