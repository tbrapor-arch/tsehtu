exercises:
  translate:
    - {tailo: "Tsit niá sann ê sann-á-ki li̍h--khì--ah, lí the̍h khì hōo a-má thīnn--tsi̍t-ē, bô, ē jú li̍h jú tuā.", hanji: "這領衫的衫仔裾裂去矣，你提去予阿媽紩一下，無，會愈裂愈大。", en: "The hem of this top has torn. Take it to Grandma to stitch, or the tear will get bigger and bigger."}
    - {tailo: "Guán a-pa tshut-mn̂g tsìn-tsîng lóng ài khòo-tuà hâ hōo ân, kóng án-ne tsiah ū tsing-sîn.", hanji: "阮阿爸出門進前攏愛褲帶縖予絚，講按呢才有精神。", en: "Before going out Dad always does his belt up tight. He says it makes him feel alert."}
    - {tailo: "Lí nā beh khì tsia̍h-toh, sió tsng-thānn--tsi̍t-ē, tshīng hit niá khóng-sik ê sann tō tsiok suí.", hanji: "你若欲去食桌，小妝娗一下，穿彼領紺色的衫就足媠。", en: "If you're going to the banquet, dress up a bit. That navy-blue top would look lovely."}
    - {tailo: "Thinn-khì tsin jua̍h, i kan-na tshīng tsi̍t niá lāi-kah-á, tō tshut-khì tiânn--lí tsē, tsia̍h liâng.", hanji: "天氣真熱，伊干焦穿一領內䘥仔，就出去埕裡坐，食涼。", en: "It was very hot, so he went out to sit in the yard in just his vest to enjoy the cool."}
    - {tailo: "Siàu-liân lâng kiat-hun, bô it-tīng ài bé suān-tsio̍h tshiú-tsí, nn̄g ê lâng siong-hó khah iàu-kín.", hanji: "少年人結婚，無一定愛買璇石手指，兩个人相好較要緊。", en: "Young people getting married don't have to buy a diamond ring. What matters more is that they love each other."}
  fill:
    - {tailo: "Lāu-lâng bīn-phuê khioh-___, ē gia̍p-sí hôo-sîn, tse sī khah-tsá ê lâng kóng-tshiò ê uē.", hanji: "老人面皮抾___，會挾死胡蠅，這是較早的人講笑的話。", answer: "kíng", answer_hanji: "襇", en: "'An old man's wrinkles are deep enough to trap a fly': that's an old joke."}
    - {tailo: "I kā bīn-kin ___ tī king-kah-thâu, tō tsáu khì tshân--lí tàu kuah-tiū-á, kui kang lóng bô hioh-khùn.", hanji: "伊共面巾___佇肩胛頭，就走去田裡鬥割稻仔，規工攏無歇睏。", answer: "phua̍h", answer_hanji: "袚", en: "He slung a towel over his shoulder and went off to the fields to help with the rice harvest, without a break all day."}
    - {tailo: "A-tsí ê thâu-mn̂g siunn tn̂g, i ta̍k-kang lóng ài iōng sann ki thâu-mn̂g-___-á kā i giap--khí-lâi.", hanji: "阿姊的頭毛傷長，伊逐工攏愛用三枝頭毛___仔共伊鋏起來。", answer: "giap", answer_hanji: "鋏", en: "My sister's hair is too long. Every day she has to pin it up with three hairpins."}
    - {tailo: "Tsit nn̄g tsiah niau-á senn kah tsin sîng, guá khuànn kui-poo iáu-sī hun-___ bē tshut-lâi.", hanji: "這兩隻貓仔生甲真成，我看規晡猶是分___袂出來。", answer: "pia̍t", answer_hanji: "別", en: "These two cats look so alike that I stared at them for ages and still couldn't tell them apart."}
    - {tailo: "Sin-niû ê kûn-___ tsin tn̂g, tshê kàu thôo-kha, ài nn̄g ê gín-á tī āu-piah kā i phâng.", hanji: "新娘的裙___真長，䠡到塗跤，愛兩个囡仔佇後壁共伊捀。", answer: "ki", answer_hanji: "裾", en: "The bride's hem was so long it trailed on the floor, and two children had to hold it up behind her."}
