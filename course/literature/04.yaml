exercises:
  translate:
    - {tailo: "Lín a-bú tsú ê kiâm-muê siunn tsiánn, guá kā i tsham tsi̍t-sut-á iâm, kiâm-tsiánn tsiah tú-hó.", hanji: "恁阿母煮的鹹糜傷汫，我共伊摻一屑仔鹽，鹹汫才拄好。", en: "The savoury congee your mother made was too bland. I added a little salt, and now the seasoning is just right."}
    - {tailo: "Tsit tiánn ti-kha ài kûn sann tiám-tsing, tsiah ē nuā-nuā hó tsia̍h, lí m̄-thang siunn kín kā hué kuainn--khì.", hanji: "這鼎豬跤愛𤉙三點鐘，才會爛爛好食，你毋通傷緊共火關去。", en: "This pot of pig's trotters needs to simmer for three hours to be tender. Don't turn the fire off too soon."}
    - {tailo: "Gín-á-lâng tsia̍h kué-tsí, lóng ài iōng tshiám-á tshiám, m̄-thang iōng tshiú khioh, tshiú lâ-sâm.", hanji: "囡仔人食果子，攏愛用攕仔攕，毋通用手抾，手垃儳。", en: "Children should spear their fruit with a fork, not pick it up with their hands. Hands are dirty."}
    - {tailo: "Āu--ji̍t guán beh khì tshī-tiûnn bé pháng kah tshài, lí nā ū-îng, beh tuè guán tsò-hué khì--bô?", hanji: "後日阮欲去市場買麭佮菜，你若有閒，欲綴阮做伙去無？", en: "The day after tomorrow we're going to the market for bread and vegetables. If you're free, do you want to come with us?"}
    - {tailo: "Tsit tiánn muê tsú kah siunn khó--ah, lí koh ka tsi̍t-kuá tsuí--lo̍h-khì, lā hōo ûn tsiah phâng--tshut-khì.", hanji: "這鼎糜煮甲傷洘矣，你閣加一寡水落去，抐予勻才捀出去。", en: "This pot of congee has got too thick. Add a little more water and stir it smooth before you serve it."}
  fill:
    - {tailo: "Bí-thng nā kún, ài kín kā hué kuainn sè, bô, ē ___--tshut-lâi, kui ê tsàu-thâu lóng tâm--khì.", hanji: "米湯若滾，愛緊共火關細，無，會___出來，規个灶頭攏澹去。", answer: "phū", answer_hanji: "浡", en: "When the rice water boils, turn the flame down quickly, or it will boil over and soak the whole stove top."}
    - {tailo: "Tsit tiunn tsuá tsiânn gâu ___ tsuí, lí the̍h khì kā toh-tíng ê tsuí tshit--khì, tsiah bē lâu kàu thôo-kha.", hanji: "這張紙誠𠢕___水，你提去共桌頂的水拭去，才袂流到塗跤。", answer: "suh", answer_hanji: "欶", en: "This paper soaks up water well. Use it to wipe the water off the table before it runs onto the floor."}
    - {tailo: "Tshài tī tiánn lāi ài kín ___--leh, bô, ē tshàu-hué-ta, hit-tsūn tō bô-hāu--ah.", hanji: "菜佇鼎內愛緊___咧，無，會臭火焦，彼陣就無效矣。", answer: "lā-lā", answer_hanji: "抐抐", en: "Give the vegetables in the wok a quick stir, or they'll burn, and then it'll be too late."}
    - {tailo: "Guá ê pe̍h sann bô-sè-jī ___-tio̍h tāu-iû, sé kui-poo to sé bē khì, tsin m̄-kam.", hanji: "我的白衫無細膩___著豆油，洗規晡都洗袂去，真毋甘。", answer: "kō", answer_hanji: "滒", en: "I got soy sauce on my white shirt by accident. I washed it all afternoon and it won't come out. What a shame."}
    - {tailo: "Tsit ê ko-á tinn-___, guá tsia̍h tsi̍t tè tō bô ài koh tsia̍h--ah, lí tsia̍h khah tsē--leh.", hanji: "這个糕仔甜___，我食一塊就無愛閣食矣，你食較濟咧。", answer: "but-but", answer_hanji: "粅粅", en: "This cake is so sweet that one piece is enough for me. You have more."}
