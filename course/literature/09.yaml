exercises:
  translate:
    - {tailo: "Tsit tsiah káu ê gê giàng-giàng, khuànn--khí-lâi tsin hiông, m̄-koh i tsiânn kuai, m̄-bat kā--lâng.", hanji: "這隻狗的牙齴齴，看起來真雄，毋過伊誠乖，毋捌咬人。", en: "This dog's teeth stick out and it looks fierce, but it's very good and has never bitten anyone."}
    - {tailo: "Tsit tsiah phòng-í tsē liáu siunn kú, tiong-ng í-king thām--lo̍h-khì, tsē--lo̍h-khì tsin bē sóng-khuài.", hanji: "這隻膨椅坐了傷久，中央已經窞落去，坐落去真袂爽快。", en: "This sofa has been sat on too long. It sags in the middle and it's uncomfortable to sit on."}
    - {tailo: "Tiánn-té ê pn̄g-phí tīng-khok-khok, guá iáu-sī khioh--khí-lâi ùn thn̂g tsia̍h, tshin-tshiūnn sè-hàn ê sî.", hanji: "鼎底的飯疕𠕇硞硞，我猶是抾起來搵糖食，親像細漢的時。", en: "The rice crust at the bottom of the pot was rock hard, but I still scraped it up and dipped it in sugar, like when I was a child."}
    - {tailo: "Lí tī-sî beh tńg-khì Tâi-uân? Lí nā tsai-iánn ji̍t-tsí, kín kā guá kóng, guá khì ki-tiûnn tsiap--lí.", hanji: "你底時欲轉去臺灣？你若知影日子，緊共我講，我去機場接你。", en: "When are you going back to Taiwan? As soon as you know the date, tell me, and I'll pick you up at the airport."}
    - {tailo: "Pâng-king bú kah jû-tsháng-tsháng, tsheh tàn kah thôo-kha tsi̍t-sì-kè, tse hiān-hiān sī sió-tī tsò--ê.", hanji: "房間舞甲挐氅氅，冊擲甲塗跤一四界，這現現是小弟做的。", en: "The room is in a complete mess, with books thrown all over the floor. This is obviously my little brother's doing."}
  fill:
    - {tailo: "Lí kám-mōo iáu-buē hó, koh tī guā-kháu lâm hōo, kui-sin-khu lâm kah tâm-___-lok, kín khì sé sio-tsuí.", hanji: "你感冒猶未好，閣佇外口淋雨，規身軀淋甲澹___漉，緊去洗燒水。", answer: "lok", answer_hanji: "漉", en: "Your cold isn't better yet and you've been out in the rain. You're soaked to the skin. Go and have a hot bath."}
    - {tailo: "Tsit kuí ji̍t hōo tsha̍p-tsha̍p-lo̍h, tshù-āu ê lōo put-sî lóng ___-lap-lap, lí kiânn-lōo ài khah sè-jī--leh.", hanji: "這幾日雨㴙㴙落，厝後的路不時攏___塌塌，你行路愛較細膩咧。", answer: "siûnn", answer_hanji: "𣻸", en: "It's been pouring these last few days, and the path behind the house is always slippery. Be careful how you walk."}
    - {tailo: "Lí kha-thâu-u ê khang-tshuì í-king kian-___--ah, m̄-thang koh iōng tshiú khì jiàu, bô, ē lâu-hueh.", hanji: "你跤頭趺的空喙已經堅___矣，毋通閣用手去抓，無，會流血。", answer: "phí", answer_hanji: "疕", en: "The cut on your knee has scabbed over. Don't pick at it again, or it will bleed."}
    - {tailo: "I khuànn-tio̍h hit tsiah tuā tsuâ, kiann kah bīn tshenn-___-sún, tsi̍t kù uē to kóng bē tshut--lâi.", hanji: "伊看著彼隻大蛇，驚甲面青___恂，一句話都講袂出來。", answer: "sún", answer_hanji: "恂", en: "When he saw the huge snake he went white with fear and couldn't get a word out."}
    - {tailo: "Guán a-kong tsin ___-khiām, tsi̍t niá sann tshīng sann-tsa̍p nî, phuà--khì tō ka-kī póo.", hanji: "阮阿公真___儉，一領衫穿三十年，破去就家己補。", answer: "khiû", answer_hanji: "虯", en: "My grandfather is very frugal. He's worn the same shirt for thirty years and mends it himself when it tears."}
