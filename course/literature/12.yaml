exercises:
  translate:
    - {tailo: "Lí nā tsiah-nī ài tsia̍h tsàu-kha ê kam-tsià, guá it-tīng bô ti̍h, guá kā guá ê hit kue̍h hōo--lí.", hanji: "你若遮爾愛食灶跤的甘蔗，我一定無挃，我共我的彼橛予你。", en: "If you love the sugar cane in the kitchen that much, I definitely don't want any. I'll give you my length."}
    - {tailo: "Lâu-hîng kám-mōo í-king thuànn--khui--ah, lín ta̍k-ke tshut-mn̂g ài sè-jī, m̄-thang hōo lâng tòo--tio̍h.", hanji: "流行感冒已經湠開矣，恁逐家出門愛細膩，毋通予人𪐞著。", en: "The flu is spreading now. Be careful when you go out, all of you, and don't catch it from anyone."}
    - {tailo: "Tsit pún tsheh ê tsuá li̍h--khì, guá iōng tsuá-ko kā i kap--khí-lâi, khuànn bē tshut ū kap-tsuā.", hanji: "這本冊的紙裂去，我用紙膏共伊敆起來，看袂出有敆逝。", en: "A page of this book was torn, so I glued it back together, and you can't see the join."}
    - {tailo: "Lí tiānn-tiānn ài ka-kī tsi̍t ê khì hái-pinn siû-tsuí, kín-tsua̍h-bān ē tshut-tāi-tsì, lí liōng-tsá thîng--leh.", hanji: "你定定愛家己一个去海邊泅水，緊縒慢會出代誌，你冗早停咧。", en: "You keep going swimming in the sea on your own. Sooner or later something will happen. Stop while there's still time."}
    - {tailo: "In nn̄g ê sī siāng-nî senn--ê, siāng-sî ji̍p ha̍k-hāu, siāng-sî thè-hiu, tsò-hué kuè sì-tsa̍p tang.", hanji: "𪜶兩个是𫝛年生的，𫝛時入學校，𫝛時退休，做伙過四十冬。", en: "The two of them were born in the same year, started school at the same time, retired at the same time, and spent forty years together."}
  fill:
    - {tailo: "Ji̍t-thâu khah kuè--leh tsiah ___-tsuí, tshài tsiah bē lian--khì, lí m̄-thang ji̍t-tàu tō ___.", hanji: "日頭較過咧才___水，菜才袂蔫去，你毋通日晝就___。", answer: "hòo", answer_hanji: "戽", en: "Water the vegetables once the sun has gone down a bit, so they don't wilt. Don't do it at midday."}
    - {tailo: "Thinn-khì piàn liâng--ah, lí koh tshīng kah po̍h-___-si, kín tńg-khì ke tsi̍t niá sann, bô, ē kám-mōo.", hanji: "天氣變涼矣，你閣穿甲薄___絲，緊轉去加一領衫，無，會感冒。", answer: "li", answer_hanji: "縭", en: "It's turned cool and you're still dressed so thinly. Go home and put on another layer, or you'll catch cold."}
    - {tailo: "Tsit kuá ê tāi-tsì a-pa kā lán kà kuí-nā pái, nā tsò kah tsáu-___, i ē tsiânn siū-khì.", hanji: "這寡的代誌阿爸共咱教幾若擺，若做甲走___，伊會誠受氣。", answer: "tsua̍h", answer_hanji: "縒", en: "Dad has shown us how to do this several times. If we get it wrong, he'll be very cross."}
    - {tailo: "Guá tú-tsiah kiânn kuè piah-pinn, sann-á-ki khì ___-tio̍h thôo-hún, pe̍h sann piàn oo--khì.", hanji: "我拄才行過壁邊，衫仔裾去___著塗粉，白衫變烏去。", answer: "huê", answer_hanji: "𫝻", en: "I walked past the wall just now, and the hem of my top brushed against the dust and turned my white top grey."}
    - {tailo: "In pē-á-kiánn senn tsò tsiok sio-___, lóng sī hòo-táu, kóng-uē ê khuán mā sio-___.", hanji: "𪜶爸仔囝生做足相___，攏是戽斗，講話的款嘛相___。", answer: "siāng", answer_hanji: "𫝛", en: "Father and son look very alike: they both have jutting jaws, and they talk the same way too."}
