exercises:
  translate:
    - {tailo: "Lí khì pâng-king siam khuànn-māi, khuànn i kám ū teh tha̍k-tsheh, ah-sī koh teh sńg tshiú-ki-á.", hanji: "你去房間䀐看覓，看伊敢有咧讀冊，抑是閣咧耍手機仔。", en: "Go and have a peek in the bedroom: see if he's studying, or playing on his phone again."}
    - {tailo: "Thôo-kha sing tsū pò-tsuá tsiah khai-sí iû-tshat, bô, iû-tshat tih--lo̍h-lâi, tō tshit bē khì--ah.", hanji: "塗跤先苴報紙才開始油漆，無，油漆滴落來，就拭袂去矣。", en: "Put newspaper down on the floor before you start painting. Otherwise, if paint drips on it, you won't be able to wipe it off."}
    - {tailo: "Tsit king tshù siunn kū--ah, tē-pán lóng hiauh--khí-lâi, kiânn--khí-lâi koh ē kī-kī-kiò, àm-sî tsi̍t ê lâng tuà tī tsia tsin kiann.", hanji: "這間厝傷舊矣，地板攏藃起來，行起來閣會吱吱叫，暗時一个人蹛佇遮真驚。", en: "This house is too old. The floorboards have all lifted, and they creak when you walk on them. It's scary living here alone at night."}
    - {tailo: "Pîng-iú pún-lâi tō ài sio-kīng, lí tsit-má tú-tio̍h khùn-lân, guán it-tīng ē tàu-sann-kāng, lí m̄-bián pháinn-sè.", hanji: "朋友本來就愛相楗，你這馬拄著困難，阮一定會鬥相共，你毋免歹勢。", en: "Friends are meant to hold each other up. You're having a hard time now, and we'll certainly help. Don't be embarrassed."}
    - {tailo: "Ko-á tsin tuā, ta̍k-ke lóng ū thang pun-phenn, m̄-bián sio-tsenn, tshun--ê lán phenn-phenn--leh, tsi̍t lâng tsi̍t tè.", hanji: "糕仔真大，逐家攏有通分伻，毋免相爭，賰的咱伻伻咧，一人一塊。", en: "The cake is big, so there's enough for everyone; no need to fight over it. We'll share out what's left, a piece each."}
  fill:
    - {tailo: "Tshiú-tsí hōo tsiam ___ tsi̍t khang, hueh lâu--tshut-lâi, a-bú kín kā guá tah tsi̍t tè io̍h-pòo.", hanji: "手指予針___一空，血流出來，阿母緊共我貼一塊藥布。", answer: "ui", answer_hanji: "揻", en: "I pricked my finger on a needle and it bled, so Mum quickly put a plaster on it."}
    - {tailo: "Kám-mōo ê sî tshut-mn̂g ài kuà tshuì-___, tsiah bē kā kám-mōo tòo hōo pa̍t-lâng, tse sī tsò-lâng ê lé-sòo.", hanji: "感冒的時出門愛掛喙___，才袂共感冒𪐞予別人，這是做人的禮數。", answer: "am", answer_hanji: "罨", en: "When you have a cold, wear a mask when you go out, so you don't pass it on to others. It's simple good manners."}
    - {tailo: "Gín-á-lâng sio-phah, kóng bô nn̄g kù tō ___--khí-lâi--ah, lāu-su kín lâi kā in pun--khui, koh kā in mē tsi̍t tǹg.", hanji: "囡仔人相拍，講無兩句就___起來矣，老師緊來共𪜶分開，閣共𪜶罵一頓。", answer: "kiat", answer_hanji: "搩", en: "The children started fighting: two words and they were at each other, and the teacher hurried over to separate them and gave them a telling-off."}
    - {tailo: "I tng-teh tuā, tsi̍t tǹg ___ tio̍h sann sì uánn pn̄g, lāu-bú tsú koh-khah tsē mā bô-kàu, ta̍k pái lóng tsia̍h kah tiánn-té bô tshun.", hanji: "伊當咧大，一頓___著三四碗飯，老母煮閣較濟嘛無夠，逐擺攏食甲鼎底無賰。", answer: "hmh", answer_hanji: "摁", en: "He's growing, and he wolfs down three or four bowls of rice a meal. However much his mother cooks, it's never enough: every time he scrapes the pot clean."}
    - {tailo: "Thang-á-mn̂g kuainn kah ba̍t-___-tsiuh, liân hôo-sîn to pue bē ji̍p--khì, pâng-king lāi tsin hip.", hanji: "窗仔門關甲密___喌，連胡蠅都飛袂入去，房間內真翕。", answer: "tsiuh", answer_hanji: "喌", en: "The windows are shut so tight that not even a fly could get in, and the room is very stuffy."}
