exercises:
  translate:
    - {tailo: "Guá ê nâ-âu khê-tio̍h tsi̍t ki hî-tshì, lim kuí-nā tshuì tsuí to lim bē lo̍h--khì, tsin kan-khóo.", hanji: "我的嚨喉㧎著一枝魚刺，啉幾若喙水都啉袂落去，真艱苦。", en: "I've got a fish bone stuck in my throat. I've drunk several mouthfuls of water and it won't go down. It's awful."}
    - {tailo: "Tsit king tshù ê mn̂g tsin pháinn kuainn, guá tiānn-tiānn ài iōng tsi̍t tè tshâ kā i tsinn--leh.", hanji: "這間厝的門真歹關，我定定愛用一塊柴共伊櫼咧。", en: "The door of this house doesn't shut properly, so I often have to wedge it with a piece of wood."}
    - {tailo: "Lo̍h tuā-hōo liáu-āu, tsit tiâu lōo tsin làm, gû-tshia sái ji̍p-khì làm-thôo, sái bē kiânn.", hanji: "落大雨了後，這條路真湳，牛車駛入去湳塗，駛袂行。", en: "After the heavy rain this road is all mud. The ox cart drove into the mire and got stuck."}
    - {tailo: "I beh tshiánn guá khì tsia̍h tuā-tǹg? Thài ē án-ne? I tsa-hng tsiah kóng i bô tsînn thang khai--leh.", hanji: "伊欲請我去食大頓？呔會按呢？伊昨昏才講伊無錢通開咧。", en: "He's treating me to a big dinner? How can that be? Only yesterday he said he had no money to spend."}
    - {tailo: "I thau the̍h kong-si ê tsînn khì pua̍h-kiáu, tāi-tsì piak-khang--ah, kong-si kā i sî--tiāu, i ê bóo mā tsáu--khì.", hanji: "伊偷提公司的錢去跋筊，代誌煏空矣，公司共伊辭掉，伊的某嘛走去。", en: "He took the company's money to gamble with, and it came to light. The company sacked him, and his wife left him too."}
  fill:
    - {tailo: "Sin-sin ê mi̍h-kiānn m̄-thang án-ne tsau-___, lí nā bô ài iōng, the̍h hōo pa̍t-lâng iōng mā hó.", hanji: "新新的物件毋通按呢蹧___，你若無愛用，提予別人用嘛好。", answer: "that", answer_hanji: "躂", en: "Don't treat brand-new things like that. If you don't want it, give it to someone else to use."}
    - {tailo: "Guán a-kong lāu--ah, thâu-mn̂g ___ kah tshun bô kuí ki, i lóng kóng sī siūnn siunn tsē.", hanji: "阮阿公老矣，頭毛___甲賰無幾枝，伊攏講是想傷濟。", answer: "lut", answer_hanji: "甪", en: "My grandfather is old now, and his hair has fallen out till there's hardly any left. He always says it's from thinking too much."}
    - {tailo: "Khah-tsá ê lâng tiānn-tiānn iōng puî ti-bah lâi ___-iû, tsú tshài khah phang, tshun ê bah-phiàn mā hó tsia̍h.", hanji: "較早的人定定用肥豬肉來___油，煮菜較芳，賰的肉片嘛好食。", answer: "piak", answer_hanji: "煏", en: "In the old days people often rendered fatty pork for lard. It made the cooking tastier, and the leftover crackling was good to eat too."}
    - {tailo: "Lâi--ah! Mn̂g-kháu ê ___-á teh hiáng, ū lâng-kheh lâi--ah, lí kín khì kā i tsio-thāi--tsi̍t-ē.", hanji: "來矣！門口的___仔咧響，有人客來矣，你緊去共伊招待一下。", answer: "giang", answer_hanji: "鈃", en: "Coming! The bell at the door is ringing. There's a customer. Go and see to them."}
    - {tailo: "I tsiàn-tsing ê sî tio̍h-___, kha tiong-ng iáu ū tsi̍t lia̍p ___-tsí, thinn-khì nā piàn tō thiànn.", hanji: "伊戰爭的時著___，跤中央猶有一粒___子，天氣若變就疼。", answer: "tshìng", answer_hanji: "銃", en: "He was shot in the war. There's still a bullet in his leg, and it hurts whenever the weather changes."}
