exercises:
  translate:
    - {tailo: "A-kong ê ba̍k-tsiu bô hó--ah, ta̍k-kang khuànn pò-tsuá lóng ài iōng hàm-kiànn, tsi̍t jī tsi̍t jī tha̍k.", hanji: "阿公的目睭無好矣，逐工看報紙攏愛用譀鏡，一字一字讀。", en: "Grandpa's eyes aren't good any more. Every day he reads the newspaper with a magnifying glass, one character at a time."}
    - {tailo: "Lí khuànn--tio̍h i, tō kín kiânn--khui, guá siōng gê tsit khuán kóng kah hó-thiann, tsò kah tsió ê lâng.", hanji: "你看著伊，就緊行開，我上㤉這款講甲好聽、做甲少的人。", en: "If you see him, walk away quickly. I can't stand people like that, all talk and no work."}
    - {tailo: "Hit ê siàu-liân--ê bô-sè-jī kā a-pô lòng--tio̍h, a-pô kā i kiāu kui-poo, i suah m̄-kánn ìn.", hanji: "彼个少年的無細膩共阿婆挵著，阿婆共伊撟規晡，伊煞毋敢應。", en: "The young man bumped into the old woman by accident. She swore at him for ages, and he didn't dare answer back."}
    - {tailo: "Lín tú-tsiah tī tsàu-kha teh tshū siánn-mih? Ū tāi-tsì tō tuā-siann kóng, m̄-thang thau-thau-á kóng.", hanji: "恁拄才佇灶跤咧呲啥物？有代誌就大聲講，毋通偷偷仔講。", en: "What were you whispering about in the kitchen just now? If something's up, say it out loud, not behind people's backs."}
    - {tailo: "I tsò tāi-tsì tsin hân-bān, tsi̍t tè í-á tsò sann kang to tsò bē hó, a-pa khuànn kah tsin bô-nāi.", hanji: "伊做代誌真頇顢，一塊椅仔做三工都做袂好，阿爸看甲真無奈。", en: "He's hopeless with his hands. He spent three days on a chair and still couldn't get it right, and Dad just shook his head."}
  fill:
    - {tailo: "Lí bô ài khì tō mài khì, lí ___-mí-khóo it-ti̍t tshiò kóng ài khì, koh ka-kī tsin bô huann-hí?", hanji: "你無愛去就莫去，你___乜苦一直笑講愛去，閣家己真無歡喜？", answer: "hô", answer_hanji: "何", en: "If you don't want to go, don't. Why keep smiling and saying you want to, when you're so unhappy about it?"}
    - {tailo: "Guán a-bú tsin ___, tsi̍t ê lâng tshī sì ê gín-á, koh khui tiàm, kui tsng lóng tsin o-ló.", hanji: "阮阿母真___，一个人飼四个囡仔，閣開店，規庄攏真呵咾。", answer: "khiàng", answer_hanji: "勥", en: "My mother is so capable: she raised four children on her own and ran a shop, and the whole village sings her praises."}
    - {tailo: "Lí ___--neh, kánn tī lāu-su ê bīn-thâu-tsîng kóng i ê pháinn-uē, i it-tīng ē siū-khì.", hanji: "你___呢，敢佇老師的面頭前講伊的歹話，伊一定會受氣。", answer: "khám-khám", answer_hanji: "歁歁", en: "Are you stupid? Badmouthing the teacher right in front of her: she's bound to get angry."}
    - {tailo: "I tsi̍t kóng-uē tō kóng ___-kóo, kóng i bat tī hái-lí kā tsi̍t bué tuā-hî phō--khí-lâi.", hanji: "伊一講話就講___古，講伊捌佇海裡共一尾大魚抱起來。", answer: "hàm", answer_hanji: "譀", en: "As soon as he opens his mouth it's tall tales: he says he once lifted a huge fish out of the sea with his bare arms."}
    - {tailo: "I tsit kuí-ji̍t ná ē piàn-tsò ___-khong, mn̄g i siánn-mih lóng ìn bô tio̍h, kám-sī ū sim-sū?", hanji: "伊這幾日哪會變做___悾，問伊啥物攏應無著，敢是有心事？", answer: "khong", answer_hanji: "悾", en: "Why has he been so vacant these last few days? Whatever you ask him, his answers are off the mark. Has he got something on his mind?"}
