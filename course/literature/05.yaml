exercises:
  translate:
    - {tailo: "Lín tú-tsiah tī tiàm-lāi ê sî, guá khuànn kàu lí hiannh tsi̍t niá âng sann, āu-lâi ū bé--bô?", hanji: "恁拄才佇店內的時，我看到你挔一領紅衫，後來有買無？", en: "When you were in the shop just now, I saw you pick up a red top. Did you buy it in the end?"}
    - {tailo: "Sè-hàn ê sî, guá ta̍k pái kiânn ke-á-lōo, lóng kā a-pa ê tshiú gīm kah ân-ân, m̄-guān pàng.", hanji: "細漢的時，我逐擺行街仔路，攏共阿爸的手扲甲絚絚，毋願放。", en: "When I was little, every time we walked in town I'd clutch Dad's hand tight and refuse to let go."}
    - {tailo: "Tsit kiānn tāi-tsì kui-ê lóng kau hōo lí lâi tsáng, ū būn-tê tsiah lâi mn̄g guá tō hó.", hanji: "這件代誌規个攏交予你來摠，有問題才來問我就好。", en: "I'm handing this whole business over to you to run. Just come and ask me if there's a problem."}
    - {tailo: "Hong tsin tuā, tsûn iô kah tsin lī-hāi, guá kan-na ē-tàng khînn-tiâu tsûn-pinn ê thih-ki.", hanji: "風真大，船搖甲真厲害，我干焦會當拑牢船邊的鐵枝。", en: "The wind was strong and the boat rocked badly. All I could do was hold on to the iron rail at the side."}
    - {tailo: "Nn̄g ê kuí-nā nî bô khuànn--tio̍h ê tsí-muē, tsi̍t kìnn-bīn tō mooh tsò-hué, ba̍k-sái lâu bē thîng.", hanji: "兩个幾若年無看著的姊妹，一見面就𢯾做伙，目屎流袂停。", en: "The two sisters who hadn't seen each other for years hugged each other the moment they met and sobbed their hearts out."}
  fill:
    - {tailo: "I tsìn-tsîng tshuē bē tio̍h ê tsînn, guân-lâi khǹg tī uē-tsheh lāi-té, hōo i ___ kah jiâu-jiâu.", hanji: "伊進前揣袂著的錢，原來囥佇畫冊內底，予伊___甲皺皺。", answer: "jio̍k", answer_hanji: "搙", en: "The money he couldn't find before was in his picture book, and he'd crumpled it all up."}
    - {tailo: "I ta̍k pái beh huat tsînn hōo gín-á, lóng uì lak-tē-á ___ kuí-nā kái, tsiah ___ tshut tsi̍t-kuá.", hanji: "伊逐擺欲發錢予囡仔，攏對橐袋仔___幾若改，才___出一寡。", answer: "jîm", answer_hanji: "撏", en: "Every time he gives the children money, he fishes in his pocket several times before he gets some out."}
    - {tailo: "Gín-á kiann tshenn-hūn, kā lāu-bú ê sann-á-bué ___-tiâu-tiâu, m̄-guān tsáu--khui, mā m̄ kā lâng kóng-uē.", hanji: "囡仔驚生份，共老母的衫仔尾___牢牢，毋願走開，嘛毋共人講話。", answer: "khi̍p", answer_hanji: "扱", en: "The child was shy of strangers and held on tight to the hem of his mother's top, refusing to leave her side or say a word to anyone."}
    - {tailo: "Lán it-tīng ài ___ tio̍h tsìng-kì, kíng-tshat tsiah ē sìn, bô, kóng koh-khah tsē mā bô-hāu.", hanji: "咱一定愛___著證據，警察才會信，無，講閣較濟嘛無效。", answer: "la̍k", answer_hanji: "搦", en: "We must get hold of evidence before the police will believe us. Otherwise there's no point."}
    - {tailo: "I ta̍k àm thau-thau tsáu tshut-khì tshit-thô, kàu lo̍h-bué iáu-sī hōo i ê lāu-pē ___--tio̍h.", hanji: "伊逐暗偷偷走出去𨑨迌，到落尾猶是予伊的老爸___著。", answer: "tsang", answer_hanji: "㨑", en: "He sneaked out to have fun every night, but in the end his father caught him."}
