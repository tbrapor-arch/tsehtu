id: 7
title: {en: "Fireflies at night", tailo: "Àm-mî ê hué-kim-koo", hanji: "暗暝的火金蛄"}
genre: story
review: false
setting: "A short story written for this course. Two cousins staying at their grandfather's in the country creep out of the house one night to see the fireflies by the stream."
chars:
  - {c: 迒, tailo: hānn, en: "step over, stride across", hint: "辶 walking + 亢"}
  - {c: 跔, tailo: ku, en: "crouch, squat; huddle up somewhere", hint: "𧾷 foot + 句 kù for the sound"}
  - {c: 䖙, tailo: the, en: "lie back, recline", hint: "虍 + 豸: a beast stretched out; 䖙椅 the-í 'reclining chair'"}
  - {c: 跕, tailo: liam, en: "walk on tiptoe", hint: "𧾷 foot + 占 tsiam"}
  - {c: 蝹, tailo: un, en: "curl up, huddle", hint: "虫 a creature + 昷 un for the sound"}
  - {c: 蹽, tailo: liâu, en: "wade across; get involved in", hint: "𧾷 foot + 尞 liâu for the sound"}
  - {c: 䠡, tailo: tshê, en: "drag along (feet, a hem); shuffle", hint: "𧾷 foot + 齊 tsê for the sound"}
  - {c: 𧿳, tailo: phu̍t, en: "(in) 𧿳𧿳跳 'hop about, jump up and down'", hint: "𧾷 foot + 卜 pok: the sound of feet hitting the ground"}
  - {c: 捗, tailo: pôo, en: "the shape of a hand or foot; (跤捗) foot, footprint", hint: "扌 + 步 pōo 'step'"}
  - {c: 橂, tailo: tīng, en: "(in) 戶橂 'threshold'", hint: "木 wood + 碇 tīng for the sound"}
dialogue:
  - {n: 1, hanji: "阿公暗頓食飽，就䖙佇䖙椅看電視，看無偌久就睏去矣。", tailo: "A-kong àm-tǹg tsia̍h pá, tō the tī the-í khuànn tiān-sī, khuànn bô guā kú tō khùn--khì--ah.", en: "After dinner Grandpa lay back in his reclining chair to watch TV, and before long he was asleep."}
  - {n: 2, hanji: "阿德細聲共我講：「溪仔邊有火金蛄，咱偷偷仔去看。」", tailo: "A-tik sè-siann kā guá kóng: “Khe-á-pinn ū hué-kim-koo, lán thau-thau-á khì khuànn.”", en: "My cousin Tik whispered to me: 'There are fireflies down by the stream. Let's sneak out and see them.'"}
  - {n: 3, hanji: "阮兩个跕跤行，一步一步行過廳，驚去共阿公吵精神。", tailo: "Guán nn̄g ê liam kha kiânn, tsi̍t pōo tsi̍t pōo kiânn kuè thiann, kiann khì kā a-kong tshá tsing-sîn.", en: "We tiptoed through the living room one step at a time, afraid of waking Grandpa."}
  - {n: 4, hanji: "門口的戶橂誠懸。阿德迒過去的時，跤去硞著戶橂，大大一聲。", tailo: "Mn̂g-kháu ê hōo-tīng tsiânn kuân. A-tik hānn--kuè-khì ê sî, kha khì kho̍k-tio̍h hōo-tīng, tuā-tuā tsi̍t siann.", en: "The threshold at the door was high. As Tik stepped over it, his foot knocked against it with a loud bang."}
  - {n: 5, hanji: "阮兩个隨跔落去，跔佇門邊，連喘氣都毋敢喘。", tailo: "Guán nn̄g ê suî ku--lo̍h-khì, ku tī mn̂g-pinn, liân tshuán-khuì to m̄-kánn tshuán.", en: "We both crouched down at once and huddled by the door, not even daring to breathe."}
  - {n: 6, hanji: "阿公䖙佇遐，身軀振動一下，閣咧鼾矣。", tailo: "A-kong the tī hia, sin-khu tín-tāng--tsi̍t-ē, koh teh huânn--ah.", en: "Grandpa, lying back in his chair, stirred, and then went on snoring."}
  - {n: 7, hanji: "阮才閣迒過戶橂，走出去埕裡。月娘真光，照甲路白白。", tailo: "Guán tsiah koh hānn kuè hōo-tīng, tsáu tshut-khì tiânn--lí. Gue̍h-niû tsin kng, tsiò kah lōo pe̍h-pe̍h.", en: "Only then did we step over the threshold and run out into the yard. The moon was so bright the path shone white."}
  - {n: 8, hanji: "去溪仔邊愛蹽過一條水溝。阮共鞋仔褪掉，跤踏落去，水冷吱吱。", tailo: "Khì khe-á-pinn ài liâu--kuè tsi̍t tiâu tsuí-kau. Guán kā ê-á thǹg--tiāu, kha ta̍h--lo̍h-khì, tsuí líng-ki-ki.", en: "To get to the stream we had to wade across a ditch. We took our shoes off and stepped in; the water was ice cold."}
  - {n: 9, hanji: "蹽到水溝彼爿，規片草仔攏是火金蛄，一閃一閃，親像天頂的星落落來。", tailo: "Liâu kàu tsuí-kau hit pîng, kui phiàn tsháu-á lóng sī hué-kim-koo, tsi̍t siám tsi̍t siám, tshin-tshiūnn thinn-tíng ê tshenn lak--lo̍h-lâi.", en: "On the other side of the ditch the whole field was full of fireflies, flashing on and off, as if the stars had fallen out of the sky."}
  - {n: 10, hanji: "阿德歡喜甲𧿳𧿳跳，跳甲水𫝺甲我規身軀。", tailo: "A-tik huann-hí kah phu̍t-phu̍t-thiàu, thiàu kah tsuí hiù kah guá kui-sin-khu.", en: "Tik was so happy he hopped up and down, splashing water all over me."}
  - {n: 11, hanji: "雄雄，草仔內有物件咧振動，閣有聲。", tailo: "Hiông-hiông, tsháu-á lāi ū mi̍h-kiānn teh tín-tāng, koh ū siann.", en: "Suddenly something moved in the grass, and there was a noise."}
  - {n: 12, hanji: "阿德驚甲蝹佇我的尻脊後，規身軀蝹做一丸。", tailo: "A-tik kiann kah un tī guá ê kha-tsiah-āu, kui-sin-khu un tsò tsi̍t uân.", en: "Tik was so scared he huddled behind me, curled up in a ball."}
  - {n: 13, hanji: "草仔內行出來的，是一隻細隻的狗仔，一肢跤䠡咧䠡咧，敢若受傷矣。", tailo: "Tsháu-á lāi kiânn--tshut-lâi--ê, sī tsi̍t tsiah sè-tsiah ê káu-á, tsi̍t ki kha tshê--leh tshê--leh, ká-ná siū-siong--ah.", en: "What came out of the grass was a little puppy, dragging one leg along as if it was hurt."}
  - {n: 14, hanji: "阮共狗仔抱起來，倒去的時，阮的褲跤澹糊糊，跤䠡甲強欲行袂振動。", tailo: "Guán kā káu-á phō--khí-lâi. Tò--khì ê sî, guán ê khòo-kha tâm-kôo-kôo, kha tshê kah kiōng-beh kiânn bē tín-tāng.", en: "We picked the puppy up. On the way back our trouser legs were soaked, and we shuffled along, barely able to walk."}
  - {n: 15, hanji: "阮閣跕跤迒過戶橂，想講無人知。", tailo: "Guán koh liam kha hānn kuè hōo-tīng, siūnn-kóng bô lâng tsai.", en: "We tiptoed back over the threshold, thinking nobody would ever know."}
  - {n: 16, hanji: "啥人知，阿公徛佇廳的中央，手攑一枝手電仔，對阮炤過來。", tailo: "Siánn-lâng tsai, a-kong khiā tī thiann ê tiong-ng, tshiú gia̍h tsi̍t ki tshiú-tiān-á, uì guán tshiō--kuè-lâi.", en: "But there was Grandpa standing in the middle of the living room with a torch in his hand, shining it at us."}
  - {n: 17, hanji: "伊共手電仔對塗跤炤：塗跤有兩逝烏烏的跤捗，對門口一直到阮的房間。", tailo: "I kā tshiú-tiān-á uì thôo-kha tshiō: thôo-kha ū nn̄g tsuā oo-oo ê kha-pôo, uì mn̂g-kháu it-ti̍t kàu guán ê pâng-king.", en: "He shone the torch at the floor: two trails of dark footprints led from the front door all the way to our room."}
  - {n: 18, hanji: "阿公講：「恁留落來的跡，比恁的喙較老實。」", tailo: "A-kong kóng: “Lín lâu--lo̍h-lâi ê jiah, pí lín ê tshuì khah láu-si̍t.”", en: "Grandpa said: 'The marks you've left are more honest than your mouths.'"}
  - {n: 19, hanji: "阿德緊共狗仔抱予阿公看：「阿公，伊的跤受傷，咱共伊留咧好無？」", tailo: "A-tik kín kā káu-á phō hōo a-kong khuànn: “A-kong, i ê kha siū-siong, lán kā i lâu--leh hó--bô?”", en: "Tik quickly held the puppy up for Grandpa to see: 'Grandpa, its leg's hurt. Can we keep it?'"}
  - {n: 20, hanji: "阿公看狗仔，閣看阮澹糊糊的褲跤，嘆一口氣：「先去共恁的跤捗洗清氣，明仔載才講。」", tailo: "A-kong khuànn káu-á, koh khuànn guán tâm-kôo-kôo ê khòo-kha, thàn tsi̍t kháu khuì: “Sing khì kā lín ê kha-pôo sé tshing-khì, bîn-á-tsài tsiah kóng.”", en: "Grandpa looked at the puppy, then at our soaking trousers, and sighed: 'Go and wash your feet first. We'll talk about it tomorrow.'"}
notes:
  - {ref: 1, topic: vocab, text: "䖙 the = lie back, recline, have a lie-down: 你若無爽快，就緊去䖙一下 'if you don't feel well, go and lie down'. 䖙椅 the-í = a reclining chair, deckchair; 半䖙倒 puànn-the-tó 'half lying down'."}
  - {ref: 2, topic: vocab, text: "火金蛄 hué-kim-koo = firefly. 偷偷仔 thau-thau-á = secretly, on the sly."}
  - {ref: 3, topic: vocab, text: "跕 liam = walk on tiptoe so as not to be heard: 跕跤行 liam kha kiânn. 吵精神 tshá tsing-sîn = wake someone up with noise (精神 tsing-sîn 'awake')."}
  - {ref: 4, topic: vocab, text: "戶橂 hōo-tīng = the raised threshold of a traditional doorway; children are told not to sit on it (囡仔人毋通坐戶橂). 迒 hānn = step over: 迒過田岸 'step over the ridge between the fields'. 硞 kho̍k (文學 2) = knock, bump."}
  - {ref: 5, topic: vocab, text: "跔 ku = crouch, squat; also stay huddled in a small place: 暫時佇遮罔跔 'make do here for the time being'. 連…都… liân… to… = not even…"}
  - {ref: 6, topic: vocab, text: "鼾 huânn = snore (also read kônn)."}
  - {ref: 8, topic: vocab, text: "蹽 liâu = wade across: 蹽水, 蹽溪仔. Figuratively 蹽落去 liâu--lo̍h-khì = get mixed up in something: 明明知影代誌真嚴重，伊嘛是蹽落去 'he knew it was serious and still waded in'. 褪 thǹg = take off (clothes, shoes)."}
  - {ref: 9, topic: vocab, text: "彼爿 hit pîng = that side, over there. 閃 siám = flash. 落 lak = fall off, drop."}
  - {ref: 10, topic: vocab, text: "𧿳𧿳跳 phu̍t-phu̍t-thiàu = hop up and down, with joy or anger: 阮母仔予我氣甲𧿳𧿳跳 'I made my mother hopping mad'; of a fish, still flapping about. 𫝺 hiù (文學 1) = splash."}
  - {ref: 12, topic: vocab, text: "蝹 un = curl up, huddle: 伊蝹佇壁邊 'he huddled against the wall'. 跔 ku is crouching on the feet, 蝹 un is curling the whole body up. 尻脊後 kha-tsiah-āu = behind someone's back."}
  - {ref: 13, topic: vocab, text: "䠡 tshê = drag along the ground: of a lame person or a crawling baby (會䠡袂爬 'can shuffle but not crawl'), or of feet or a long hem: 行路毋通按呢䠡 'don't drag your feet like that'."}
  - {ref: 14, topic: vocab, text: "倒去 tò--khì = go back, return. 澹糊糊 tâm-kôo-kôo = soaking wet."}
  - {ref: 16, topic: vocab, text: "炤 tshiō = shine a light on: 用手電仔炤 'shine a torch on'. 手電仔 tshiú-tiān-á = torch, flashlight."}
  - {ref: 17, topic: vocab, text: "捗 pôo = the shape of a hand or foot: 跤捗 kha-pôo 'foot; footprint', 手捗 tshiú-pôo 'palm; handprint'. 跤捗號 = shoe size. 逝 tsuā = a line, a trail."}
  - {ref: 18, topic: vocab, text: "跡 jiah = a mark, a trace left behind. 老實 láu-si̍t = honest."}
