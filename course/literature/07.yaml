exercises:
  translate:
    - {tailo: "Sè-hàn ê sî, guá tsiânn ài tsē tī hōo-tīng tíng tán a-pa tńg--lâi, a-má lóng kiò guá m̄-thang tsē.", hanji: "細漢的時，我誠愛坐佇戶橂頂等阿爸轉來，阿媽攏叫我毋通坐。", en: "When I was little I loved sitting on the threshold waiting for Dad to come home, but Grandma always told me not to sit there."}
    - {tailo: "Tsit tah bô kiô, ài liâu khe-á kuè--khì, lí kā ê-á thǹg--leh, khòo-kha mā kńg khah kuân--leh.", hanji: "這搭無橋，愛蹽溪仔過去，你共鞋仔褪咧，褲跤嘛捲較懸咧。", en: "There's no bridge here, so we'll have to wade across the stream. Take your shoes off and roll your trouser legs up higher."}
    - {tailo: "Guá ê kha-pôo pí lâng khah tuā, ta̍k pái bé ê-á lóng tshuē bô ha̍p ê hō, tsin thâu-thiànn.", hanji: "我的跤捗比人較大，逐擺買鞋仔攏揣無合的號，真頭疼。", en: "My feet are bigger than most people's. Every time I buy shoes I can't find my size, and it's a real headache."}
    - {tailo: "Tsit king pâng-king tsiah-nī sè, sann ê lâng tō ài ku tī tsia khùn, koh ài tuà kui kò gue̍h.", hanji: "這間房間遮爾細，三个人就愛跔佇遮睏，閣愛蹛規個月。", en: "This room is so small, and the three of us have to huddle in here to sleep, and for a whole month at that."}
    - {tailo: "Tsit kiānn tāi-tsì tsin hiám, lí bîng-bîng tsai-iánn, nā liâu--lo̍h-khì, it-tīng ē hāi kàu ka-kī.", hanji: "這件代誌真險，你明明知影，若蹽落去，一定會害到家己。", en: "This business is dangerous, and you know it. If you get mixed up in it, you'll only hurt yourself."}
  fill:
    - {tailo: "A-má ji̍t-tàu tsia̍h pá, tō ài ___ tī the-í tíng thiann siu-im-ki, thiann--leh thiann--leh tō khùn--khì.", hanji: "阿媽日晝食飽，就愛___佇䖙椅頂聽收音機，聽咧聽咧就睏去。", answer: "the", answer_hanji: "䖙", en: "After lunch Grandma likes to lie back in her reclining chair listening to the radio, and she nods off as she listens."}
    - {tailo: "Lí kha-kut iáu-buē hó, kiânn-lōo m̄-thang tshê kha, mā m̄-thang ___ kuè tsiah kuân ê tshân-huānn.", hanji: "你跤骨猶未好，行路毋通䠡跤，嘛毋通___過遮懸的田岸。", answer: "hānn", answer_hanji: "迒", en: "Your leg hasn't healed yet. Don't drag your feet when you walk, and don't go stepping over field ridges as high as these."}
    - {tailo: "Sió-tī khuànn-tio̍h kuí-á-hì, kiann kah ___ tī phuē-lāi, kui-sin-khu kiu tsò tsi̍t uân.", hanji: "小弟看著鬼仔戲，驚甲___佇被內，規身軀勼做一丸。", answer: "un", answer_hanji: "蝹", en: "My little brother was so scared by the ghost film that he curled up under the covers in a ball."}
    - {tailo: "Bîn-á-tsài a-pa beh kah lâng khì Ji̍t-pún tshit-thô, tsa-àm i tō huann-hí kah ___-thiàu.", hanji: "明仔載阿爸欲佮人去日本𨑨迌，昨暗伊就歡喜甲___跳。", answer: "phu̍t-phu̍t", answer_hanji: "𧿳𧿳", en: "Tomorrow Dad is going to Japan on holiday with his friends, and last night he was already hopping up and down with excitement."}
    - {tailo: "Gín-á teh khùn, lí ji̍p-khì pâng-king ài ___ kha kiânn, m̄-thang kā i tshá tsing-sîn.", hanji: "囡仔咧睏，你入去房間愛___跤行，毋通共伊吵精神。", answer: "liam", answer_hanji: "跕", en: "The baby's asleep. Tiptoe when you go into the room, and don't wake him."}
