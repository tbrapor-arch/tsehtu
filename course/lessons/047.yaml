id: 47
title: {en: "An argument", tailo: "Uan-ke", hanji: "冤家"}
review: false
setting: "A café. A-bîng arrives very late, and A-hun is waiting."
dialogue:
  - {n: 1, speaker: A-hun, hanji: "你又閣遲到！我等規點鐘矣。", tailo: "Lí iū-koh tî-tò! Guá tán kui tiám-tsing--ah.", en: "You're late again! I've been waiting a whole hour."}
  - {n: 2, speaker: A-bîng, hanji: "歹勢啦，路裡窒車。", tailo: "Pháinn-sè--lah, lōo--lí that-tshia.", en: "Sorry, there was traffic on the way."}
  - {n: 3, speaker: A-hun, hanji: "你莫閣講白賊！你代先講你袂記得矣。", tailo: "Lí mài koh kóng-pe̍h-tsha̍t! Lí tāi-sing kóng lí bē-kì-tit--ah.", en: "Stop lying! Earlier you said you'd forgotten."}
  - {n: 4, speaker: A-bîng, hanji: "你莫遐大聲喝，逐家攏咧看咧。", tailo: "Lí mài hiah tuā-siann huah, ta̍k-ke lóng teh khuànn--leh.", en: "Don't shout so loud, everyone's looking."}
  - {n: 5, speaker: A-hun, hanji: "我欲大聲就大聲！約束好的時間，你應該準時啊。", tailo: "Guá beh tuā-siann tō tuā-siann! Iok-sok hó ê sî-kan, lí ing-kai tsún-sî--ah.", en: "I'll be as loud as I like! We agreed on a time; you should be on time."}
  - {n: 6, speaker: A-bîng, hanji: "好啦好啦，攏是我毋著，莫閣怪我矣。", tailo: "Hó--lah hó--lah, lóng sī guá m̄-tio̍h, mài koh kuài guá--ah.", en: "OK, OK, it's all my fault. Stop blaming me."}
  - {n: 7, speaker: A-hun, hanji: "你逐擺攏按呢講，毋過下擺閣再遲到。", tailo: "Lí ta̍k pái lóng án-ne kóng, m̄-koh ē-pái koh-tsài tî-tò.", en: "You say that every time, and then you're late again the next time."}
  - {n: 8, speaker: "A-bîng", hanji: "你莫遐計較好無？我嘛是不得已，頭家臨時叫我加班。", tailo: "Lí mài hiah kè-kàu hó--bô? Guá mā sī put-tik-í, thâu-ke lîm-sî kiò guá ka-pan.", en: "Don't make such a fuss, will you? I had no choice: my boss asked me to stay late at the last minute."}
  - {n: 9, speaker: "A-hun", hanji: "你拄才講窒車，這馬閣講加班，你欲按怎證明？", tailo: "Lí tú-tsiah kóng that-tshia, tsit-má koh kóng ka-pan, lí beh án-tsuánn tsìng-bîng?", en: "A minute ago it was the traffic, now it's overtime. How are you going to prove it?"}
  - {n: 10, speaker: "A-bîng", hanji: "……好啦，我照實講，我睏過頭矣。", tailo: "…… Hó--lah, guá tsiàu-si̍t kóng, guá khùn kuè-thâu--ah.", en: "…All right, I'll tell you the truth: I overslept."}
  - {n: 11, speaker: "A-hun", hanji: "你看！我上討厭人講白賊。", tailo: "Lí khuànn! Guá siōng thó-ià lâng kóng-pe̍h-tsha̍t.", en: "See! What I hate most is people lying."}
  - {n: 12, speaker: "A-bîng", hanji: "我驚你受氣，才毋敢講。", tailo: "Guá kiann lí siū-khì, tsiah m̄ kánn kóng.", en: "I was afraid you'd be angry, that's why I didn't dare say."}
  - {n: 13, speaker: "A-hun", hanji: "你閣按呢，下擺我就毋等你矣。我家己去看電影，予你一个人佇遮慢慢仔睏！", tailo: "Lí koh án-ne, ē-pái guá tō m̄ tán lí--ah. Guá ka-kī khì khuànn tiān-iánn, hōo lí tsi̍t ê lâng tī tsia bān-bān-á khùn!", en: "Do that again and next time I won't wait for you. I'll go to the cinema on my own, and you can stay here and sleep as long as you like!"}
notes:
  - {ref: 1, topic: grammar, text: "又閣 iū-koh = again (and annoyingly so) (又): stronger than 閣 alone. 遲到 tî-tò = be late. 規 kui + measure = a whole …: 規點鐘 'a whole hour', 規工 'a whole day'."}
  - {ref: 2, topic: vocab, text: "路裡 lōo--lí = on the way (路上). 窒車 that-tshia = traffic jam (塞車): MOE writes it with 窒 that, to block up."}
  - {ref: 3, topic: vocab, text: "講白賊 kóng-pe̍h-tsha̍t = tell lies (說謊): 白賊 'lie'. 代先 tāi-sing = earlier, at first (先前)."}
  - {ref: 4, topic: grammar, text: "喝 huah = shout (喊): a false friend, not 'drink' (drink is 啉 lim). 大聲 tuā-siann = loud(ly); 細聲 sè-siann = quietly. 咧 --leh at the end of a sentence insists: 'look, they're watching!'."}
  - {ref: 5, topic: grammar, text: "欲 X 就 X 'I'll X if I want to': a defiant pattern. 約束 iok-sok = agree on, an appointment (約定). 應該 ing-kai = should. 準時 tsún-sî = on time."}
  - {ref: 6, topic: grammar, text: "啦 --lah at the end softens or concedes: 好啦好啦 'all right, all right'. 怪 kuài = blame. 攏是我毋著 'it's all my fault'."}
  - {ref: 7, topic: grammar, text: "逐 ta̍k + classifier = every: 逐擺 'every time', 逐家 'everyone', 逐工 'every day'. 閣再 koh-tsài = again (once more)."}
  - {ref: 8, topic: "vocab", text: "計較 kè-kàu = make a fuss, be petty about something: 莫佮伊計較 'don't argue with him over it'. 不得已 put-tik-í = have no choice, can't help it. 臨時 lîm-sî = at the last minute, temporary. 加班 ka-pan = work overtime."}
  - {ref: 9, topic: "vocab", text: "拄才 = just now (lesson 17). 證明 tsìng-bîng = prove; proof."}
  - {ref: 10, topic: "vocab", text: "照實講 tsiàu-si̍t kóng = tell the truth, say it as it is (照實 'according to the facts'). 睏過頭 khùn kuè-thâu = oversleep: 過頭 kuè-thâu = too much, past the limit."}
  - {ref: 11, topic: "vocab", text: "討厭 thó-ià = hate, find annoying."}
  - {ref: 12, topic: "grammar", text: "才毋敢講 'that's why I didn't dare say': 才 links a cause to its result, as 毋才 does (lesson 22)."}
