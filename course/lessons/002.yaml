exercises:
  translate:
  - tailo: Lí sī tó-uī lâng?
    hanji: 你是佗位人？
    en: Where are you from?
  - tailo: Guá tsit-má tuà tī Tâi-pak.
    hanji: 我這馬蹛佇臺北。
    en: I live in Taipei now.
  - tailo: Guá teh o̍h Tâi-gí.
    hanji: 我咧學臺語。
    en: I'm learning Taiwanese.
  - tailo: "Guá mā sī sin ê tshù-pinn."
    hanji: "我嘛是新的厝邊。"
    en: "I'm a new neighbour too."
  - tailo: "Lí tsit-má tuà tī tó-uī?"
    hanji: "你這馬蹛佇佗位？"
    en: "Where do you live now?"
  fill:
  - tailo: Lí kiò ___ miâ?
    hanji: 你叫___名？
    answer: siánn-mih
    answer_hanji: 啥物
    en: What's your name?
  - tailo: Guá ___ Tâi-lâm-lâng.
    hanji: 我___臺南人。
    answer: m̄-sī
    answer_hanji: 毋是
    en: I'm not from Tainan.
  - tailo: "Guá ___ Huat-kok-lâng, guá sī Tâi-lâm-lâng."
    hanji: "我___法國人，我是臺南人。"
    answer: "m̄-sī"
    answer_hanji: "毋是"
    en: "I'm not French, I'm from Tainan."
