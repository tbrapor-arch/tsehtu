  - {tailo: té, hanji: 短, en: "short"}
  - {tailo: óng, hanji: 往, en: "bound for"}
  - {tailo: lí-kheh, hanji: 旅客, en: "passenger, traveller"}
  - {tailo: tsiūnn-tshia, hanji: 上車, en: "get on (a vehicle)"}
  - {tailo: pó-tiōng, hanji: 保重, en: "take care"}
  - {tailo: āu-pái, hanji: 後擺, en: "next time"}
