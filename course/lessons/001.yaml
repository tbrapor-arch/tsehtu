exercises:
  translate:
    - tailo: "Lí tsia̍h-pá--buē?"
      hanji: "你食飽未？"
      en: "Have you eaten yet?"
    - tailo: "Guá beh tsi̍t pue tāu-ling."
      hanji: "我欲一杯豆奶。"
      en: "I'd like a soy milk."
    - tailo: "Iáu-buē, guá beh lâi tsia̍h tsá-tǹg."
      hanji: "猶未，我欲來食早頓。"
      en: "Not yet, I've come for breakfast."
  fill:
    - tailo: "Tse sī ___?"
      hanji: "這是___？"
      answer: "siánn-mih"
      answer_hanji: "啥物"
      en: "What's this?"
    - tailo: "Lí ___ kóng Tâi-gí--ooh!"
      hanji: "你___講臺語喔！"
      answer: "ē-hiáu"
      answer_hanji: "會曉"
      en: "You can speak Taiwanese!"

