id: 23
title:
  en: New Year
  tailo: Kuè-nî
  hanji: 過年
review: false
setting: A few days before Lunar New Year.
dialogue:
- n: 1
  speaker: A-bîng
  hanji: 新年快樂！
  tailo: Sin-nî khuài-lo̍k!
  en: Happy New Year!
- n: 2
  speaker: Sam
  hanji: 恭喜發財！
  tailo: Kiong-hí huat-tsâi!
  en: Wishing you prosperity!
- n: 3
  speaker: A-bîng
  hanji: 今年過年你欲佮阮做伙轉去臺南圍爐無？
  tailo: Kin-nî kuè-nî lí beh kah guán tsò-hué tńg-khì Tâi-lâm uî-lôo--bô?
  en: This New Year, do you want to come back to Tainan with us for the reunion dinner?
- n: 4
  speaker: Sam
  hanji: 好啊！圍爐是啥物意思？
  tailo: Hó--ah! Uî-lôo sī siánn-mih ì-sù?
  en: Sure! What does 'uî-lôo' mean?
- n: 5
  speaker: A-bîng
  hanji: 就是年兜規家伙仔做伙食飯。
  tailo: Tō sī nî-tau kui-ke-hué-á tsò-hué tsia̍h-pn̄g.
  en: It's when the whole family eats together on New Year's Eve.
- n: 6
  speaker: A-bîng
  hanji: 阿公阿媽閣會包紅包予囡仔。
  tailo: A-kong a-má koh ē pau âng-pau hōo gín-á.
  en: And Grandpa and Grandma give red envelopes to the children.
- n: 7
  speaker: Sam
  hanji: 按呢我嘛愛包紅包予阿公阿媽無？
  tailo: Án-ne guá mā ài pau âng-pau hōo a-kong a-má--bô?
  en: So should I give a red envelope to your grandparents too?
- n: 8
  speaker: A-bîng
  hanji: 你若有趁錢，包予序大人嘛會使。
  tailo: Lí nā ū thàn-tsînn, pau hōo sī-tuā-lâng mā ē-sái.
  en: If you earn money, you can give one to the elders too.
- n: 9
  speaker: "A-bîng"
  hanji: "正月初一阮會先去廟拜拜，初二阮大姊佮姊夫就轉外家。"
  tailo: "Tsiann--gue̍h tshe-it guán ē sing khì biō pài-pài, tshe-jī guán tuā-tsí kah tsí-hu tō tńg guā-ke."
  en: "On the first day of the first month we go to the temple first, and on the second my eldest sister and her husband come home to her parents."
- n: 10
  speaker: "A-bîng"
  hanji: "閣有，阿媽講初一毋通掃地。若無，規年的錢會攏走去！"
  tailo: "Koh-ū, a-má kóng tshe-it m̄-thang sàu-tè. Nā-bô, kui-nî ê tsînn ē lóng tsáu--khì!"
  en: "And A-má says you mustn't sweep the floor on the first day. Otherwise the whole year's money will run away!"
notes:
- ref: 1
  topic: vocab
  text: >-
    新年快樂 sin-nî khuài-lo̍k and 恭喜發財 kiong-hí huat-tsâi: the two standard wishes, same characters as in Mandarin, Taigi readings.
- ref: 3
  topic: vocab
  text: >-
    今年 kin-nî = this year; 過年 kuè-nî = (celebrate) the New Year. 圍爐 uî-lôo = the New Year's Eve family dinner (literally 'gather
    round the stove'). 佮 kah + person + 做伙 = together with someone.
- ref: 4
  topic: vocab
  text: '意思 ì-sù = meaning: …是啥物意思？ ''what does … mean?'', a question you''ll use a lot.'
- ref: 5
  topic: vocab
  text: >-
    就是 tō sī = that is, it's (just) (就是). 年兜 nî-tau = New Year's Eve (除夕). 規家伙仔 kui-ke-hué-á = the whole family (全家人).
- ref: 6
  topic: grammar
  text: >-
    包紅包 pau âng-pau = give a red envelope. 予 hōo + person after the verb = to someone: 包紅包予囡仔 'give red envelopes to the children'.
- ref: 8
  topic: grammar
  text: >-
    若 nā = if (如果): 你若有趁錢 'if you earn money'. 若…就… nā … tō … is the full pattern. 趁錢 thàn-tsînn = earn money (賺錢): 趁 is a
    false friend. 序大人 sī-tuā-lâng = one's elders, parents and grandparents.
- ref: 9
  topic: "culture"
  text: "正月 tsiann--gue̍h = the first lunar month (note tsiann, and the neutral tone on 月); 初一 tshe-it = the first day of a lunar month, 初二 tshe-jī the second. On 初二 married daughters go back to their parents' home, 轉外家 tńg guā-ke: 外家 guā-ke = a married woman's parents' family. 大姊 tuā-tsí = eldest sister; 姊夫 tsí-hu = elder sister's husband."
- ref: 10
  topic: "culture"
  text: "掃地 sàu-tè = sweep the floor (掃 sàu 'sweep'). On New Year's Day you don't sweep, take out the rubbish or wash your hair, so as not to sweep away the year's luck and money. 規年 kui-nî = the whole year. 若無 nā-bô = otherwise."
