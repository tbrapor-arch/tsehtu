id: 24
title:
  en: At the pharmacy
  tailo: Tī io̍h-pâng
  hanji: 佇藥房
review: false
setting: A neighbourhood pharmacy. Sam has a sore throat.
dialogue:
- n: 1
  speaker: Pharmacist
  hanji: 你好，欲買啥？
  tailo: Lí hó, beh bé siánn?
  en: Hello, what can I get you?
- n: 2
  speaker: Sam
  hanji: 我嚨喉疼，閣一直咳嗽。
  tailo: Guá nâ-âu thiànn, koh it-ti̍t ka-sàu.
  en: My throat hurts and I keep coughing.
- n: 3
  speaker: Pharmacist
  hanji: 有發燒無？
  tailo: Ū huat-sio--bô?
  en: Do you have a fever?
- n: 4
  speaker: Sam
  hanji: 無，干焦頭殼小可仔疼。
  tailo: Bô, kan-na thâu-khak sió-khuá-á thiànn.
  en: No, just a bit of a headache.
- n: 5
  speaker: Pharmacist
  hanji: 按呢你食這款藥仔，一工三擺，食飽才食。
  tailo: Án-ne lí tsia̍h tsit khuán io̍h-á, tsi̍t kang sann pái, tsia̍h-pá tsiah tsia̍h.
  en: Then take this one, three times a day, after meals.
- n: 6
  speaker: Pharmacist
  hanji: 若兩工猶閣無好，愛去看醫生。
  tailo: Nā nn̄g kang iáu-koh bô hó, ài khì khuànn-i-sing.
  en: If you're not better in two days, you need to see a doctor.
- n: 7
  speaker: Sam
  hanji: 一包偌濟錢？
  tailo: Tsi̍t pau guā-tsē tsînn?
  en: How much is a pack?
- n: 8
  speaker: Pharmacist
  hanji: 一百二。
  tailo: Tsi̍t-pah-jī.
  en: A hundred and twenty.
- n: 9
  speaker: "Pharmacist"
  hanji: "一般的嚨喉疼，三四工就好矣。毋過這幾工暫時莫勉強，加啉水。"
  tailo: "It-puann ê nâ-âu thiànn, sann-sì kang tō hó--ah. M̄-koh tsit kuí kang tsiām-sî mài bián-kióng, ke lim tsuí."
  en: "An ordinary sore throat clears up in three or four days. But for the next few days don't push yourself, and drink plenty of water."
- n: 10
  speaker: "Pharmacist"
  hanji: "你若會當請假，就請兩工假佇厝歇睏，按呢毋才會較緊好。"
  tailo: "Lí nā ē-tàng tshíng-ká, tō tshíng nn̄g kang ká tī tshù hioh-khùn, án-ne m̄-tsiah ē khah kín hó."
  en: "If you can take time off, take two days and rest at home; that's the way to get better faster."
notes:
- ref: 2
  topic: vocab
  text: >-
    嚨喉 nâ-âu = throat (喉嚨: the two characters swap places). 一直 it-ti̍t = keep (doing), all the time. 咳嗽 ka-sàu = cough. More
    in the Health theme.
- ref: 4
  topic: vocab
  text: >-
    頭殼 thâu-khak = head (頭); 頭殼疼 'headache'. 小可仔 sió-khuá-á = a little, slightly: a gentler word than 淡薄仔 (lesson 10).
- ref: 5
  topic: grammar
  text: >-
    Frequency: 一工三擺 tsi̍t kang sann pái 'three times a day' (一天三次). 擺 pái counts occurrences, 工 kang counts days. 食飽才食 'take
    it after eating': 才 again, 'only then'.
- ref: 6
  topic: grammar
  text: 若…猶閣無… nā … iáu-koh bô … = if … still not … . 愛 ài = must (here 'you need to').
- ref: 7
  topic: grammar
  text: >-
    偌濟錢？ guā-tsē tsînn? = how much (money)? (多少錢). 偌濟 guā-tsē = how much / how many; 錢 tsînn = money. 包 pau = a pack (classifier).
- ref: 8
  topic: grammar
  text: >-
    Prices are shortened as in Mandarin: 一百二 tsi̍t-pah-jī = 120 (the 十 is dropped). Note 二 jī here, not 兩 nn̄g: a digit trailing
    after 百 or 千 is read jī (but 兩百 nn̄g-pah for 200).
- ref: 9
  topic: "vocab"
  text: "一般 it-puann = ordinary, common; 一般人 'most people'. 暫時 tsiām-sî = for the time being. 勉強 bián-kióng = force (yourself or someone): 莫勉強 'don't push yourself'; 感情袂當勉強 'you can't force love'. 加啉水 'drink more water': 加 ke + verb = do more of it."
- ref: 10
  topic: "grammar"
  text: "請假 tshíng-ká = take leave, ask for time off. Like many verb + object words it splits around a number: 請兩工假 'take two days off'. 毋才 m̄-tsiah (lesson 22): '(only) that way will …'."
