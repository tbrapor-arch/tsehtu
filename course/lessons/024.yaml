- tailo: sió-khuá-á
  hanji: 小可仔
  en: a little, slightly
- tailo: guā-tsē
  hanji: 偌濟
  en: how much, how many
- tailo: tsînn
  hanji: 錢
  en: money
exercises:
  translate:
  - tailo: Tsi̍t pau guā-tsē tsînn?
    hanji: 一包偌濟錢？
    en: How much is a pack?
  - tailo: Tsi̍t kang sann pái, tsia̍h-pá tsiah tsia̍h.
    hanji: 一工三擺，食飽才食。
    en: Three times a day, after meals.
  fill:
  - tailo: Guá ___ thiànn.
    hanji: 我___疼。
    answer: nâ-âu
    answer_hanji: 嚨喉
    en: My throat hurts.
  - tailo: Nā nn̄g kang ___ bô hó, ài khì khuànn-i-sing.
    hanji: 若兩工___無好，愛去看醫生。
    answer: iáu-koh
    answer_hanji: 猶閣
    en: If you're still not better in two days, see a doctor.
