  - {tailo: pi-siong, hanji: 悲傷, en: "sad"}
  - {tailo: siú, hanji: 首, en: "classifier for songs"}
  - {tailo: sàn-tshiah, hanji: 散赤, en: "poor"}
  - {tailo: lī-khui, hanji: 離開, en: "leave"}
  - {tailo: kòo-hiong, hanji: 故鄉, en: "home town"}
  - {tailo: su-liām, hanji: 思念, en: "miss, long for"}
  - {tailo: sim-kuann, hanji: 心肝, en: "heart; darling"}
  - {tailo: tò-tńg, hanji: 倒轉, en: "return, go back"}
  - {tailo: kám-tsîng, hanji: 感情, en: "feeling"}
  - {tailo: kua-sû, hanji: 歌詞, en: "lyrics"}
