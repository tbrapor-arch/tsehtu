id: 41
title: {en: "Feelings", tailo: "Sim-lāi ê uē", hanji: "心內的話"}
review: false
setting: "A-hun comes home from work upset. Her older brother A-bîng is there with Sam."
dialogue:
  - {n: 1, speaker: A-bîng, hanji: "小妹，你哪會遮爾鬱卒？", tailo: "Sió-muē, lí ná ē tsiah-nī ut-tsut?", en: "Little sister, why so down?"}
  - {n: 2, speaker: A-hun, hanji: "今仔日予主管罵，我真委屈。", tailo: "Kin-á-ji̍t hōo tsú-kuán mē, guá tsin uí-khut.", en: "My boss told me off today. It's so unfair."}
  - {n: 3, speaker: A-hun, hanji: "伊講我做毋著，其實毋是我的錯。", tailo: "I kóng guá tsò m̄-tio̍h, kî-si̍t m̄ sī guá ê tshò.", en: "He said I did it wrong, but actually it wasn't my mistake."}
  - {n: 4, speaker: Sam, hanji: "莫受氣，嘛莫傷心。", tailo: "Mài siū-khì, mā mài siong-sim.", en: "Don't be angry, and don't be sad."}
  - {n: 5, speaker: A-bîng, hanji: "阿兄共你講，明仔載你紲落去做，伊就會知。", tailo: "A-hiann kā lí kóng, bîn-á-tsài lí suà--lo̍h-khì tsò, i tō ē tsai.", en: "Listen to your big brother: tomorrow you just carry on, and he'll understand."}
  - {n: 6, speaker: A-hun, hanji: "恁兩个遮好，我真感心。", tailo: "Lín nn̄g ê tsiah hó, guá tsin kám-sim.", en: "You two are so nice, I'm really touched."}
  - {n: 7, speaker: Sam, hanji: "來，我講一个笑詼予你聽。", tailo: "Lâi, guá kóng tsi̍t ê tshiò-khue hōo lí thiann.", en: "Come on, let me tell you a funny story."}
  - {n: 8, speaker: A-hun, hanji: "好啦，笑一下，心情就較好矣。", tailo: "Hó--lah, tshiò--tsi̍t-ē, sim-tsîng tō khah hó--ah.", en: "OK. A little laugh and I already feel better."}
  - {n: 9, speaker: "A-hun", hanji: "我毋是欲哭，我是感覺足冤枉。", tailo: "Guá m̄ sī beh khàu, guá sī kám-kak tsiok uan-óng.", en: "I'm not going to cry; I just feel so wronged."}
  - {n: 10, speaker: "A-bîng", hanji: "阿兄知你冤枉。毋過你莫後悔，你做的是著的。", tailo: "A-hiann tsai lí uan-óng. M̄-koh lí mài hiō-hué, lí tsò--ê sī tio̍h--ê.", en: "Your big brother knows you've been treated unfairly. But don't have regrets: what you did was right."}
  - {n: 11, speaker: "Sam", hanji: "有代誌就講出來，莫家己一个人憂悶。", tailo: "Ū tāi-tsì tō kóng--tshut-lâi, mài ka-kī tsi̍t ê lâng iu-būn.", en: "If something's wrong, talk about it. Don't sit there brooding on your own."}
  - {n: 12, speaker: "A-hun", hanji: "多謝恁安慰我。明仔載我會好好仔共主管講，共代誌的經過講予伊聽，代誌就會解決。", tailo: "To-siā lín an-uì--guá. Bîn-á-tsài guá ē hó-hó-á kā tsú-kuán kóng, kā tāi-tsì ê king-kuè kóng hōo i thiann, tāi-tsì tō ē kái-kuat.", en: "Thank you both for cheering me up. Tomorrow I'll talk to my boss calmly and tell him what really happened, and then it'll get sorted out."}
notes:
  - {ref: 1, topic: vocab, text: "鬱卒 ut-tsut = depressed, fed up (鬱悶). A very common Taigi word, also used in Taiwan Mandarin. 心內 sim-lāi = in one's heart; 心內的話 'what's on one's mind'."}
  - {ref: 2, topic: grammar, text: "予 hōo + person + verb = passive (被): 予主管罵 'was told off by the boss' (lesson 35). 罵 mē = scold. 主管 tsú-kuán = boss, manager. 委屈 uí-khut = feel wronged."}
  - {ref: 3, topic: grammar, text: "做毋著 tsò m̄-tio̍h = do wrong: verb + 毋著 'wrongly'; verb + 著 'correctly'. 其實 kî-si̍t = actually. 錯 tshò = mistake, fault."}
  - {ref: 4, topic: vocab, text: "受氣 siū-khì = get angry (生氣): 受 'suffer' + 氣 'anger'. 傷心 siong-sim = sad, hurt. 莫…嘛莫… 'neither … nor …'."}
  - {ref: 5, topic: grammar, text: "阿兄 a-hiann = older brother. Speaking of oneself as 阿兄 to a younger sibling is natural. 紲落去 suà--lo̍h-khì = carry on (繼續下去): 紲 suà = continue, follow on. 伊就會知 'then he'll know'."}
  - {ref: 6, topic: false-friend, text: "感心 kám-sim = touched, grateful (感動). Not 'disgusting' (Mandarin 噁心 is a different word)."}
  - {ref: 7, topic: grammar, text: "講…予你聽 kóng … hōo lí thiann = tell you (講給你聽). 笑詼 tshiò-khue = a joke, something funny."}
  - {ref: 8, topic: grammar, text: "Verb + 一下 = do briefly: 笑一下 'have a little laugh'. 心情 sim-tsîng = mood. Feelings so far: 歡喜 happy, 快樂 joyful, 受氣 angry, 傷心 sad, 鬱卒 down, 煩惱 worried, 驚 afraid, 委屈 wronged, 感心 touched."}
  - {ref: 9, topic: "vocab", text: "冤枉 uan-óng = wronged, unjustly blamed; also 'wasted (effort)': 冤枉路 'a wasted journey'."}
  - {ref: 10, topic: "vocab", text: "後悔 hiō-hué = regret: note the reading hiō for 後 here, not āu."}
  - {ref: 11, topic: "vocab", text: "憂悶 iu-būn = brood, be depressed (憂愁煩悶), a step beyond 鬱卒. 講出來 = say it out loud, talk about it."}
  - {ref: 12, topic: "vocab", text: "安慰 an-uì = comfort, console. 經過 king-kuè = what happened, the course of events (and 'go through', lesson 34). 解決 kái-kuat = solve, sort out."}
