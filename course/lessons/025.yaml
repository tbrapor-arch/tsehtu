exercises:
  translate:
  - tailo: Guá beh suè-tshù.
    hanji: 我欲稅厝。
    en: I'm looking for a place to rent.
  - tailo: Mài siunn uànn tshá lâng.
    hanji: 莫傷晏吵人。
    en: Don't make noise too late.
  - tailo: "Guá ê pâng-king ū nn̄g ê thang-á."
    hanji: "我的房間有兩个窗仔。"
    en: "My room has two windows."
  - tailo: "I tú-tú tshut-mn̂g."
    hanji: "伊拄拄出門。"
    en: "She's just gone out."
  fill:
  - tailo: Tsit ___ pâng-king tsi̍t kò gue̍h tsi̍t-bān-jī.
    hanji: 這___房間一個月一萬二。
    answer: king
    answer_hanji: 間
    en: This room is twelve thousand a month.
  - tailo: Tshù-lāi ___ tsú-tsia̍h--bô?
    hanji: 厝內___煮食無？
    answer: ē-sái
    answer_hanji: 會使
    en: Can I cook in the flat?
  - tailo: "Tíng-thâu iáu ū tsi̍t king, ___ ū lâng bô beh suè."
    hanji: "頂頭猶有一間，___有人無欲稅。"
    answer: "tú-tú"
    answer_hanji: "拄拄"
    en: "There's another one upstairs; someone has just given it up."
  - tailo: "Guán tau ê thang-á ǹg ___."
    hanji: "阮兜的窗仔向___。"
    answer: "sai-pîng"
    answer_hanji: "西爿"
    en: "The windows of our home face west."
