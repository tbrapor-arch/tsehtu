id: 25
title:
  en: Looking for a flat
  tailo: Beh suè-tshù
  hanji: 欲稅厝
review: false
setting: Sam visits a room for rent. The landlady shows him around.
dialogue:
- n: 1
  speaker: Sam
  hanji: 你好，我欲稅厝。
  tailo: Lí hó, guá beh suè-tshù.
  en: Hello, I'm looking for a place to rent.
- n: 2
  speaker: Landlady
  hanji: 這間房間一個月一萬二。
  tailo: Tsit king pâng-king tsi̍t kò gue̍h tsi̍t-bān-jī.
  en: This room is twelve thousand a month.
- n: 3
  speaker: Sam
  hanji: 有較俗的無？
  tailo: Ū khah sio̍k ê--bô?
  en: Is there anything cheaper?
- n: 4
  speaker: Landlady
  hanji: 彼間較細，一萬爾爾，毋過無窗仔。
  tailo: Hit king khah sè, tsi̍t-bān niā-niā, m̄-koh bô thang-á.
  en: That one is smaller, only ten thousand, but it has no window.
- n: 5
  speaker: Sam
  hanji: 無窗仔袂使。厝內會使煮食無？
  tailo: Bô thang-á bē-sái. Tshù-lāi ē-sái tsú-tsia̍h--bô?
  en: No window won't do. Can I cook in the flat?
- n: 6
  speaker: Landlady
  hanji: 會使，毋過莫傷晏吵人。
  tailo: Ē-sái, m̄-koh mài siunn uànn tshá lâng.
  en: Yes, but don't make noise too late.
- n: 7
  speaker: Sam
  hanji: 好，我閣想看覓，明仔載共你講。
  tailo: Hó, guá koh siūnn khuànn-māi, bîn-á-tsài kā lí kóng.
  en: OK, I'll think about it and let you know tomorrow.
- n: 8
  speaker: "Landlady"
  hanji: "啊，等咧！頂頭猶有一間，拄拄有人無欲稅，有窗仔，向西爿。"
  tailo: "Ah, tán--leh! Tíng-thâu iáu ū tsi̍t king, tú-tú ū lâng bô beh suè, ū thang-á, ǹg sai-pîng."
  en: "Oh, wait! There's another one upstairs. Someone has just given it up; it has a window and faces west."
- n: 9
  speaker: "Sam"
  hanji: "向西爿？下晡敢袂傷熱？"
  tailo: "Ǹg sai-pîng? Ē-poo kám bē siunn jua̍h?"
  en: "Facing west? Won't it be too hot in the afternoon?"
- n: 10
  speaker: "Landlady"
  hanji: "方向是較無好，毋過一個月才一萬一，比這間貴淡薄爾爾，閣有窗仔。你欲去頂頭看覓無？"
  tailo: "Hong-hiòng sī khah bô hó, m̄-koh tsi̍t kò gue̍h tsiah tsi̍t-bān-it, pí tsit king kuì tām-po̍h niā-niā, koh ū thang-á. Lí beh khì tíng-thâu khuànn-māi--bô?"
  en: "The direction isn't the best, but it's only eleven thousand a month, just a little more than this one, and it has a window. Do you want to go upstairs and have a look?"
notes:
- ref: 1
  topic: false-friend
  text: 稅厝 suè-tshù = rent a home (租房子). 稅 suè means 'rent' here, not 'tax'. 厝 tshù = house, home.
- ref: 2
  topic: grammar
  text: >-
    間 king = classifier for rooms and buildings: 這間房間 'this room'. 一個月 tsi̍t kò gue̍h = a month, per month. 萬 bān = ten thousand:
    一萬二 tsi̍t-bān-jī = 12,000, shortened like 一百二 in lesson 24.
- ref: 4
  topic: vocab
  text: 窗仔 thang-á = window. 爾爾 niā-niā = only (lesson 1).
- ref: 5
  topic: grammar
  text: >-
    袂使 bē-sái = won't do, not allowed (不行). 會使…無？ ē-sái … --bô? = may I …? 厝內 tshù-lāi = indoors, in the house. 煮食 tsú-tsia̍h
    = cook (做飯).
- ref: 6
  topic: vocab
  text: 晏 uànn = late (晚). 傷晏 'too late (at night)'. 吵人 tshá lâng = disturb people.
- ref: 7
  topic: grammar
  text: 想看覓 siūnn khuànn-māi = think it over. 共你講 'let you know' (lesson 13).
- ref: 8
  topic: "vocab"
  text: "頂頭 tíng-thâu = upstairs, above, on top: 囥佇椅仔頂頭 'put it on the chair'. 拄拄 tú-tú = just (now), only just: 伊拄拄出去 'she's just gone out'; it also means 'exactly, just right'. 向 ǹg = face (a direction); 西爿 sai-pîng = the west side, west (東爿 tang-pîng = east)."
- ref: 10
  topic: "vocab"
  text: "方向 hong-hiòng = direction, which way a flat faces; in Taiwan people check it carefully because of the afternoon sun. 淡薄 tām-po̍h = a little, slightly: 貴淡薄 'a bit dearer' (also 淡薄仔)."
