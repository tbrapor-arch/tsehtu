    - {tailo: "Guá kám-kak nn̄g pîng lóng ū tō-lí.", hanji: "我感覺兩爿攏有道理。", en: "I think both sides have a point."}
    - {tailo: "Tsi̍t hong-bīn ài tsū-iû, līng-guā tsi̍t hong-bīn mā ài tàu-tīn.", hanji: "一方面愛自由，另外一方面嘛愛鬥陣。", en: "On the one hand we want freedom, on the other hand we need to work together."}
  fill:
    - {tailo: "Guá bô ___.", hanji: "我無___。", answer: "tông-ì", answer_hanji: "同意", en: "I disagree."}
