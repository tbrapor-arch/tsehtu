  - {tailo: ko, hanji: 哥, en: "elder brother"}
  - {tailo: pí-lūn, hanji: 比論, en: "for example"}
  - {tailo: kuài-kuài, hanji: 怪怪, en: "a bit odd"}
  - {tailo: sû, hanji: 詞, en: "word, term"}
  - {tailo: kì, hanji: 記, en: "remember, memorise"}
  - {tailo: huat-im, hanji: 發音, en: "pronunciation"}
