id: 27
title:
  en: Complaining
  tailo: Jua̍h kah beh sí!
  hanji: 熱甲欲死！
review: false
setting: A heatwave in Taipei. The air conditioning in Sam and A-bîng's building has broken down.
dialogue:
- n: 1
  speaker: Sam
  hanji: 今仔日熱甲欲死！
  tailo: Kin-á-ji̍t jua̍h kah beh sí!
  en: It's so hot today I could die!
- n: 2
  speaker: A-bîng
  hanji: 冷氣歹去矣。
  tailo: Líng-khì pháinn--khì--ah.
  en: The air conditioning has broken.
- n: 3
  speaker: Sam
  hanji: 厝主講幾工才欲來修理？
  tailo: Tshù-tsú kóng kuí kang tsiah beh lâi siu-lí?
  en: How many days did the landlord say before they come to fix it?
- n: 4
  speaker: A-bîng
  hanji: 伊講禮拜五。我氣甲毋知欲講啥。
  tailo: I kóng lé-pài-gōo. Guá khì kah m̄ tsai beh kóng siánn.
  en: He said Friday. I'm so angry I don't know what to say.
- n: 5
  speaker: Sam
  hanji: 隔壁閣咧吵，吵甲我頭殼疼。
  tailo: Keh-piah koh teh tshá, tshá kah guá thâu-khak thiànn.
  en: And next door are making noise again, so loud it's giving me a headache.
- n: 6
  speaker: A-bîng
  hanji: 煞煞去，咱出去食冰！
  tailo: Suah-suah--khì, lán tshut-khì tsia̍h ping!
  en: Forget it, let's go out for shaved ice!
- n: 7
  speaker: Sam
  hanji: 好主意！
  tailo: Hó tsú-ì!
  en: Good idea!
- n: 8
  speaker: "A-bîng"
  hanji: "（食冰的時）厝主竟然講，叫咱閣忍耐幾工就好。"
  tailo: "(Tsia̍h ping ê sî) Tshù-tsú kìng-jiân kóng, kiò lán koh jím-nāi kuí kang tō hó."
  en: "(Over shaved ice) The landlord actually told us to just put up with it for a few more days."
- n: 9
  speaker: "Sam"
  hanji: "熱甲按呢，欲按怎忍耐？無冷氣，咱只好先去買一个電風。"
  tailo: "Jua̍h kah án-ne, beh án-tsuánn jím-nāi? Bô líng-khì, lán tsí-hó sing khì bé tsi̍t ê tiān-hong."
  en: "In this heat, how are we supposed to put up with it? With no air conditioning, we'll just have to go and buy a fan."
- n: 10
  speaker: "A-bîng"
  hanji: "何必買？我有一个朋友有電風無咧用。我等一下去提，咱暗時就毋免熱甲睏袂去。"
  tailo: "Hô-pit bé? Guá ū tsi̍t ê pîng-iú ū tiān-hong bô teh iōng. Guá tán--tsi̍t-ē khì the̍h, lán àm-sî tō m̄-bián jua̍h kah khùn bē khì."
  en: "Why buy one? A friend of mine has a fan he isn't using. I'll go and get it later, and then we won't lie awake tonight because of the heat."
notes:
- ref: 1
  topic: grammar
  text: >-
    Adjective / verb + 甲 kah + result = so … that (…得…): 熱甲欲死 'so hot I could die' (熱得要死). The most expressive Taigi structure:
    everything after 甲 says how far it went.
- ref: 2
  topic: grammar
  text: >-
    歹去 pháinn--khì = break down, go bad (壞掉). 歹 pháinn = bad, broken; 去 after it (neutral tone) marks a change for the worse.
    冷氣 líng-khì = air conditioning.
- ref: 3
  topic: vocab
  text: 厝主 tshù-tsú = landlord, house owner (房東). 修理 siu-lí = repair. 幾工才 'how many days until'.
- ref: 4
  topic: grammar
  text: >-
    氣甲毋知欲講啥 'so angry I don't know what to say': the result after 甲 can be a whole clause. 氣 khì = angry. 禮拜五 lé-pài-gōo =
    Friday.
- ref: 5
  topic: grammar
  text: >-
    吵甲我頭殼疼 'so noisy (it makes) my head ache': the result can have its own subject (我). 隔壁 keh-piah = next door, the neighbours.
- ref: 6
  topic: vocab
  text: >-
    煞煞去 suah-suah--khì = forget it, drop it (算了). 煞 suah on its own means 'stop, end' or 'unexpectedly'. 食冰 tsia̍h ping =
    have shaved ice (冰 ping = ice, iced dessert).
- ref: 7
  topic: vocab
  text: '主意 tsú-ì = idea: 好主意 ''good idea''.'
- ref: 8
  topic: "vocab"
  text: "竟然 kìng-jiân = actually, would you believe (居然), for something surprising or outrageous. 忍耐 jím-nāi = put up with it, be patient: 小忍耐一下 'bear with it a moment'."
- ref: 9
  topic: "vocab"
  text: "只好 tsí-hó = have no choice but to, can only. 電風 tiān-hong = electric fan ('electric wind'). 熱甲按呢 'hot like this': 甲 + 按呢 'to this degree'."
- ref: 10
  topic: "grammar"
  text: "何必 hô-pit = why bother, there's no need to: 何必買？ 'why buy one?'. 毋免 'won't have to'. 熱甲睏袂去 'so hot you can't sleep' (V 甲, lesson 27; 睏袂去, lesson 12)."
