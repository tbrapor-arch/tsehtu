- tailo: tshù-tsú
  hanji: 厝主
  en: landlord
- tailo: siu-lí
  hanji: 修理
  en: repair
- tailo: khì
  hanji: 氣
  en: angry
- tailo: keh-piah
  hanji: 隔壁
  en: next door
- tailo: suah-suah--khì
  hanji: 煞煞去
  en: forget it, drop it
- tailo: ping
