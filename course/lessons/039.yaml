  - {tailo: lé-pài, hanji: 禮拜, en: "week"}
  - {tailo: tshuì, hanji: 喙, en: "mouth"}
  - {tailo: peh-khui, hanji: 擘開, en: "open wide"}
  - {tailo: tsi̍h, hanji: 舌, en: "tongue"}
  - {tailo: thòo, hanji: 吐, en: "spit, stick out"}
  - {tailo: huat-iām, hanji: 發炎, en: "be inflamed"}
  - {tailo: tik-khak, hanji: 的確, en: "surely; (for many) maybe"}
  - {tailo: giâm-tiōng, hanji: 嚴重, en: "serious"}
