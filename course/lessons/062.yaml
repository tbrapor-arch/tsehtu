exercises:
  translate:
    - {tailo: "Kàu tē-jī ê tshenn-âng-ting uat tò-tshiú.", hanji: "到第二个青紅燈斡倒手。", en: "Turn left at the second traffic lights."}
    - {tailo: "Guá kàu-uī--ah!", hanji: "我到位矣！", en: "I'm here!"}
  fill:
    - {tailo: "Khuànn-tio̍h lâng tō ___ tshia-tòng.", hanji: "看著人就___車擋。", answer: "ta̍h", answer_hanji: "踏", en: "Brake when you see people."}
    - {tailo: "Tsiànn-tshiú, tò-tshiú, guá ___ hun bē tshing-tshó.", hanji: "正手、倒手，我___分袂清楚。", answer: "tiānn-tiānn", answer_hanji: "定定", en: "Right and left, I'm always mixing them up."}
