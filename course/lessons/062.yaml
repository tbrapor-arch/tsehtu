  - {tailo: tshenn-âng-ting, hanji: 青紅燈, en: "traffic lights"}
  - {tailo: ti̍t-ti̍t, hanji: 直直, en: "straight on"}
  - {tailo: tuì-bīn, hanji: 對面, en: "opposite"}
  - {tailo: thàng, hanji: 迵, en: "go through to"}
