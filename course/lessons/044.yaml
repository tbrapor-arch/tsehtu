  - {tailo: bān-bān-á, hanji: 慢慢仔, en: "slowly"}
  - {tailo: lòng, hanji: 挵, en: "knock, bump"}
  - {tailo: phuà, hanji: 破, en: "break; broken"}
  - {tailo: kué-tsí, hanji: 果子, en: "fruit"}
  - {tailo: tshiū-thâu, hanji: 樹頭, en: "base of a tree"}
  - {tailo: tsìng, hanji: 種, en: "grow, plant"}
  - {tailo: sio̍k-gí, hanji: 俗語, en: "proverb"}
  - {tailo: ua̍h, hanji: 活, en: "live"}
  - {tailo: sing-ua̍h, hanji: 生活, en: "life"}
