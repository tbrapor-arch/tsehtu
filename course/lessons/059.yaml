  - {tailo: bô-huat-tōo, hanji: 無法度, en: "nothing can be done"}
  - {tailo: liáu-tsînn, hanji: 了錢, en: "lose money"}
  - {tailo: sàng, hanji: 送, en: "give, throw in"}
  - {tailo: sîng-kau, hanji: 成交, en: "deal"}
  - {tailo: guân-lâi, hanji: 原來, en: "so, I see"}
  - {tailo: kóng-kè, hanji: 講價, en: "bargain"}
