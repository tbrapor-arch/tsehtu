id: 26
title:
  en: Hobbies
  tailo: Lí kah-ì siánn?
  hanji: 你佮意啥？
review: false
setting: A-hun and Sam chat about free time.
dialogue:
- n: 1
  speaker: A-hun
  hanji: 你歇睏的時陣攏咧創啥？
  tailo: Lí hioh-khùn ê sî-tsūn lóng teh tshòng siánn?
  en: What do you usually do in your free time?
- n: 2
  speaker: Sam
  hanji: 我佮意看電影，嘛定定去𬦰山。
  tailo: Guá kah-ì khuànn tiān-iánn, mā tiānn-tiānn khì peh-suann.
  en: I like watching films, and I often go hiking.
- n: 3
  speaker: A-hun
  hanji: 我較興唱歌，禮拜六攏佮朋友去唱。
  tailo: Guá khah hìng tshiùnn-kua, lé-pài-la̍k lóng kah pîng-iú khì tshiùnn.
  en: I'm more into singing. Every Saturday I go and sing with friends.
- n: 4
  speaker: Sam
  hanji: 你攏唱啥物歌？
  tailo: Lí lóng tshiùnn siánn-mih kua?
  en: What songs do you sing?
- n: 5
  speaker: A-hun
  hanji: 臺語歌啊！較早的歌上好聽。
  tailo: Tâi-gí kua--ah! Khah-tsá ê kua siōng hó-thiann.
  en: Taiwanese songs! The old songs sound the best.
- n: 6
  speaker: Sam
  hanji: 有影喔？下擺𤆬我去。
  tailo: Ū-iánn--ooh? Ē-pái tshuā guá khì.
  en: Really? Take me along next time.
- n: 7
  speaker: A-hun
  hanji: 好，毋過你愛唱一條臺語歌。
  tailo: Hó, m̄-koh lí ài tshiùnn tsi̍t tiâu Tâi-gí kua.
  en: OK, but you have to sing a Taiwanese song.
- n: 8
  speaker: "Sam"
  hanji: "好啊！毋過我較佮意恁阿公的歌。我時常聽伊唸歌，攏聽無。"
  tailo: "Hó--ah! M̄-koh guá khah kah-ì lín a-kong ê kua. Guá sî-siông thiann i liām-kua, lóng thiann bô."
  en: "Sure! But I prefer your grandpa's songs. I often listen to him chanting, and I can't understand a word."
- n: 9
  speaker: "A-hun"
  hanji: "阿公唱的是較早的歌仔，這馬的少年真少聽。"
  tailo: "A-kong tshiùnn--ê sī khah-tsá ê kua-á, tsit-má ê siàu-liân tsin tsió thiann."
  en: "What Grandpa sings are old folk songs; young people hardly ever listen to them now."
- n: 10
  speaker: "Sam"
  hanji: "我真欣賞彼款歌仔。下擺你去唱歌，我共你做伴；你唱新的歌，我佇邊仔學恁阿公唸歌。"
  tailo: "Guá tsin him-sióng hit khuán kua-á. Ē-pái lí khì tshiùnn-kua, guá kā lí tsò-phuānn; lí tshiùnn sin ê kua, guá tī pinn--á o̍h lín a-kong liām-kua."
  en: "I really love that kind of song. Next time you go singing I'll keep you company: you sing the new songs, and I'll sit beside you learning to chant like your grandpa."
notes:
- ref: 1
  topic: grammar
  text: '攏 lóng + 咧 + verb = usually be doing: 攏咧創啥 ''what do you (generally) do?''. …的時陣 = when (lesson 20).'
- ref: 2
  topic: vocab
  text: >-
    佮意 kah-ì = like, be fond of (喜歡). 定定 tiānn-tiānn = often (常常). 𬦰山 peh-suann = climb a mountain, go hiking; 𬦰 peh is a
    rare character the app font supplies. 電影 tiān-iánn = film.
- ref: 3
  topic: grammar
  text: >-
    興 hìng = be keen on (愛好); 較興 'prefer, be more into'. 唱歌 tshiùnn-kua = sing; 歌 kua = song. 佮 kah + person = with someone.
- ref: 5
  topic: vocab
  text: 好聽 hó-thiann = sound nice. 上 siōng + adjective = the most (lesson 10).
- ref: 6
  topic: vocab
  text: >-
    有影 ū-iánn = really, true (真的): 有影喔？ 'really?'. 下擺 ē-pái = next time (下次). 𤆬 tshuā = take (someone) along (lesson 12).
- ref: 7
  topic: grammar
  text: '條 tiâu = classifier for songs (and long thin things, roads, debts): 一條歌.'
- ref: 8
  topic: "culture"
  text: "唸歌 liām-kua = chant, sing a ballad in the old storytelling style, often with a moon lute (月琴); it is half sung, half recited. 時常 sî-siông = often, a more written synonym of 定定. 攏聽無 'can't understand any of it'."
- ref: 9
  topic: "vocab"
  text: "歌仔 kua-á = folk songs, ballads, songs in the old style (歌仔戲 is Taiwanese opera)."
- ref: 10
  topic: "vocab"
  text: "欣賞 him-sióng = appreciate, admire, enjoy (art, music, scenery). 做伴 tsò-phuānn = keep someone company: 共你做伴 'keep you company'. 邊仔 pinn--á = beside, nearby."
