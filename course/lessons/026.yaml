    hanji: 我___去𬦰山。
    answer: tiānn-tiānn
    answer_hanji: 定定
    en: I often go hiking.
  - tailo: ___--ooh?
    hanji: ___喔？
    answer: Ū-iánn
    answer_hanji: 有影
    en: Really?
  - tailo: "A-kong ê kua-á, guá tsiok ___."
    hanji: "阿公的歌仔，我足___。"
    answer: "him-sióng"
    answer_hanji: "欣賞"
    en: "I really admire Grandpa's ballads."
