    en: I like watching films.
  - tailo: Ē-pái tshuā guá khì.
    hanji: 下擺𤆬我去。
    en: Take me along next time.
  - tailo: "Ē-pái lí khì tshiùnn-kua, guá kā lí tsò-phuānn."
    hanji: "下擺你去唱歌，我共你做伴。"
    en: "Next time you go singing, I'll keep you company."
  - tailo: "Tsit tiâu kua tsin hó-thiann."
    hanji: "這條歌真好聽。"
    en: "This song sounds really nice."
  - tailo: "Lé-pài-ji̍t guá tiānn-tiānn kap pîng-iú khì peh-suann."
    hanji: "禮拜日我定定佮朋友去𬦰山。"
    en: "On Sundays I often go hiking with friends."
  fill:
