id: 30
title: {en: "At the bank", tailo: "Tī gîn-hâng", hanji: "佇銀行"}
review: false
setting: "Sam goes to the bank to open an account."
dialogue:
  - {n: 1, speaker: Clerk, hanji: "你好，今仔日欲辦啥物？", tailo: "Lí hó, kin-á-ji̍t beh pān siánn-mih?", en: "Hello, what can I do for you today?"}
  - {n: 2, speaker: Sam, hanji: "我欲開一个戶頭。", tailo: "Guá beh khui tsi̍t ê hōo-thâu.", en: "I'd like to open an account."}
  - {n: 3, speaker: Clerk, hanji: "請共你的證件佮印仔提予我。", tailo: "Tshiánn kā lí ê tsìng-kiānn kah ìn-á the̍h hōo guá.", en: "Please give me your ID and your seal."}
  - {n: 4, speaker: Sam, hanji: "我是外國人，干焦有護照，無印仔。", tailo: "Guá sī guā-kok-lâng, kan-na ū hōo-tsiàu, bô ìn-á.", en: "I'm a foreigner. I only have a passport, no seal."}
  - {n: 5, speaker: Clerk, hanji: "無要緊，簽名嘛會使。", tailo: "Bô iàu-kín, tshiam-miâ mā ē-sái.", en: "That's fine, a signature will do."}
  - {n: 6, speaker: Clerk, hanji: "你今仔日欲存偌濟？", tailo: "Lí kin-á-ji̍t beh tsûn guā-tsē?", en: "How much would you like to deposit today?"}
  - {n: 7, speaker: Sam, hanji: "先存一萬五千。", tailo: "Sing tsûn tsi̍t-bān gōo-tshing.", en: "Fifteen thousand to start."}
  - {n: 8, speaker: Clerk, hanji: "好，這是你的簿仔。以後你會使家己來領錢。", tailo: "Hó, tse sī lí ê phōo-á. Í-āu lí ē-sái ka-kī lâi niá-tsînn.", en: "Here's your passbook. From now on you can come and withdraw money yourself."}
notes:
  - {ref: 1, topic: vocab, text: "辦 pān = handle, do (paperwork) (辦). 銀行 gîn-hâng = bank: 銀 gîn 'silver, money'."}
  - {ref: 2, topic: vocab, text: "開戶頭 khui hōo-thâu = open a bank account (開戶). 戶頭 hōo-thâu = account."}
  - {ref: 3, topic: grammar, text: "共 X 提予我 kā X the̍h hōo guá = give X to me (把X拿給我): 共 brings the object forward, 予 marks who gets it. A pattern you'll use daily. 證件 tsìng-kiānn = ID papers; 印仔 ìn-á = personal seal, still used in Taiwanese banks."}
  - {ref: 4, topic: vocab, text: "外國人 guā-kok-lâng = foreigner. 護照 hōo-tsiàu = passport."}
  - {ref: 5, topic: vocab, text: "簽名 tshiam-miâ = sign (one's name). 無要緊 bô iàu-kín = no problem, it doesn't matter."}
  - {ref: 6, topic: grammar, text: "存 tsûn = deposit, save (存). 偌濟 guā-tsē = how much (lesson 24)."}
  - {ref: 7, topic: grammar, text: "Thousands: 千 tshing (colloquial; literary tshian). 一萬五千 tsi̍t-bān gōo-tshing = 15,000; in speech often shortened to 一萬五 tsi̍t-bān-gōo."}
  - {ref: 8, topic: vocab, text: "簿仔 phōo-á = notebook, (bank) passbook. 以後 í-āu = from now on, later. 家己 ka-kī = oneself (自己). 領錢 niá-tsînn = withdraw money (領 = collect, receive; the same 領 is the classifier for clothes in lesson 15)."}
