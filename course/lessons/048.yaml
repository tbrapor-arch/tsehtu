  - {tailo: guân-liōng, hanji: 原諒, en: "forgive"}
  - {tailo: pó-tsìng, hanji: 保證, en: "promise, guarantee"}
  - {tailo: tsīn-liōng, hanji: 盡量, en: "do one's best to"}
  - {tailo: kái, hanji: 改, en: "change, correct"}
  - {tailo: oh, hanji: 僫, en: "hard (to do)"}
  - {tailo: hòng-sim, hanji: 放心, en: "don't worry"}
