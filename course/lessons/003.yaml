exercises:
  translate:
    - tailo: "Lí bat lim oo-liông-tê--bô?"
      hanji: "你捌啉烏龍茶無？"
      en: "Have you ever had oolong tea?"
    - tailo: "Bē sio--ah."
      hanji: "袂燒矣。"
      en: "It's not hot any more."
    - tailo: "Kóng khuànn-māi."
      hanji: "講看覓。"
      en: "Try saying it."
  fill:
    - tailo: "Guá ___ lim oo-liông-tê."
      hanji: "我___啉烏龍茶。"
      answer: "m̄ bat"
      answer_hanji: "毋捌"
      en: "I've never had oolong tea."
    - tailo: "Lí beh ke thn̂g--bô? ___, án-ne tō hó."
      hanji: "你欲加糖無？___，按呢就好。"
      answer: "Bô ài"
      answer_hanji: "無愛"
      en: "Do you want sugar? No thanks, it's fine like this."

