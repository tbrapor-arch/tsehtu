    - {tailo: "Ta̍k-ke phâng uánn, mài uan-ke.", hanji: "逐家捀碗，莫冤家。", en: "Everybody take your bowl, no squabbling."}
    - {tailo: "Kàu tē-jī ê tshenn-âng-ting uat tsiànn-tshiú.", hanji: "到第二个青紅燈斡正手。", en: "Turn right at the second traffic lights."}
  fill:
    - {tailo: "I ___ kut-la̍t, koh tsin sè-jī.", hanji: "伊___骨力，閣真細膩。", answer: "m̄-nā", answer_hanji: "毋但", en: "He's not only hard-working but careful too."}
    - {tailo: "I tiānn-tiānn kiânn ___ lōo.", hanji: "伊定定行___路。", answer: "m̄-tio̍h", answer_hanji: "毋著", en: "He's always going the wrong way."}
