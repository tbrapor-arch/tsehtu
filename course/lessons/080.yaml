    - {tailo: "Tsìng-lâng lóng kuī tī lōo-pinn.", hanji: "眾人攏跪佇路邊。", en: "People kneel by the roadside."}
    - {tailo: "Lán khì biō-tiânn sio-hiunn.", hanji: "咱去廟埕燒香。", en: "Let's go to the temple square and burn incense."}
