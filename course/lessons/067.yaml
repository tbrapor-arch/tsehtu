    - {tailo: "Sui-jiân ū ki-khì, m̄-koh siōng iàu-kín ê pōo-sòo iáu tio̍h khò kha-tshiú.", hanji: "雖然有機器，毋過上要緊的步數猶著靠跤手。", en: "Although there are machines, the most important steps still depend on human hands."}
