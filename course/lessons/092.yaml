    - {tailo: "Tī Tâi-pak, keh-piah ê lâng mā senn-hūn.", hanji: "佇臺北，隔壁的人嘛生份。", en: "In Taipei even your next-door neighbours are strangers."}
    - {tailo: "Lâng khì tó-uī, sim tō tī tó-uī.", hanji: "人去佗位，心就佇佗位。", en: "Wherever you go, your heart goes with you."}
