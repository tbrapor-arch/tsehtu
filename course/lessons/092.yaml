  - {tailo: si̍p-kuàn, hanji: 習慣, en: "be used to; habit"}
  - {tailo: senn-hūn, hanji: 生份, en: "unfamiliar, strange"}
  - {tailo: tsi̍k-bo̍k, hanji: 寂寞, en: "lonely"}
  - {tailo: pài-la̍k, hanji: 拜六, en: "Saturday"}
  - {tailo: Ka-gī, hanji: 嘉義, en: "Chiayi"}
  - {tailo: king-lí, hanji: 經理, en: "manager"}
  - {tailo: huē-gī, hanji: 會議, en: "meeting"}
  - {tailo: khui-huē, hanji: 開會, en: "hold a meeting"}
  - {tailo: tsí, hanji: 姊, en: "elder sister (after a name)"}
  - {tailo: jia̍t-tsîng, hanji: 熱情, en: "warm, friendly"}
  - {tailo: líng-tām, hanji: 冷淡, en: "cold, aloof"}
