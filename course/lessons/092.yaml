    - {tailo: "Guá iáu-buē si̍p-kuàn Tâi-pak ê sing-ua̍h.", hanji: "我猶未習慣臺北的生活。", en: "I'm not used to life in Taipei yet."}
  fill:
    - {tailo: "Kám-kak ū tām-po̍h-á ___.", hanji: "感覺有淡薄仔___。", answer: "tsi̍k-bo̍k", answer_hanji: "寂寞", en: "I felt a bit lonely."}
    - {tailo: "Sóo-í lí kóng-uē ū lâm-pōo ___.", hanji: "所以你講話有南部___。", answer: "khiunn", answer_hanji: "腔", en: "So you speak with a southern accent."}
    - {tailo: "Tsit ê lâng tsin ___, guá tsi̍t-ē tō siūnn-beh kap i tsò pîng-iú.", hanji: "這个人真___，我一下就想欲佮伊做朋友。", answer: "jia̍t-tsîng", answer_hanji: "熱情", en: "This person is very warm; I wanted to be friends right away."}
