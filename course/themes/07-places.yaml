  - hanji: 出口
    tailo: tshut-kháu
    en: exit; export
    zh: 出口
  text:
  - hanji: 糞埽車暗時七點來，愛先做回收。
    tailo: Pùn-sò-tshia àm-sî tshit tiám lâi, ài sing tsò huê-siu.
    en: The rubbish truck comes at seven in the evening; sort the recycling first.
  - hanji: 我今仔日無閒煮飯，叫外送。
    tailo: Guá kin-á-ji̍t bô-îng tsú-pn̄g, kiò guā-sàng.
    en: I'm too busy to cook today, so I order a delivery.
  - hanji: 厝配的包裹明仔載會送到。
    tailo: Tshù-phuè ê pau-kó bîn-á-tsài ē sàng kàu.
    en: The parcel will be delivered to the house tomorrow.
  - hanji: 圖書館的入口佇電梯邊仔。
    tailo: Tôo-su-kuán ê ji̍p-kháu tī tiān-thui pinn-á.
    en: The library entrance is next to the lift.
  - hanji: 若揣無路，會使去派出所問警察。
    tailo: Nā tshuē bô lōo, ē-sái khì phài-tshut-sóo mn̄g kíng-tshat.
    en: If you get lost, you can ask the police at the local station.
