id: places
title:
  en: Places, transport and directions
  hanji: 所在、交通佮方向
  tailo: sóo-tsāi, kau-thong kap hong-hiòng
intro: Places, positions, sides and directions, coming and going, town and country, streets and buildings, and transport. Groups 9–11 (MRT and buses, the road, city services) end with a short text; words the MOE dictionary lacks are taken from iTaigi and carry an iTaigi badge.
