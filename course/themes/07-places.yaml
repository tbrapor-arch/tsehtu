    tailo: tuann-tsuā
    en: one-way, single
    zh: 單程
  - hanji: 去倒
    tailo: khì-tò
    en: return, round trip
    zh: 來回
  - hanji: 悠遊卡
    tailo: iu-iû-khah
    en: EasyCard (transport card)
    zh: 悠遊卡
    source: itaigi
  text:
  - hanji: 我逐工坐捷運上班。
    tailo: Guá ta̍k-kang tsē tsia̍t-ūn siōng-pan.
    en: I take the MRT to work every day.
  - hanji: 入站的時，悠遊卡鑢一下就好。
    tailo: Ji̍p tsām ê sî, iu-iû-khah lù--tsi̍t-ē tō hó.
    en: Going into the station, you just swipe your EasyCard.
  - hanji: 佇車站盤車，坐公車閣二十分鐘就到矣。
    tailo: Tī tshia-tsām puânn-tshia, tsē kong-tshia koh jī-tsa̍p hun-tsing tō kàu--ah.
    en: I change at the station, and twenty more minutes by bus and I'm there.
  - hanji: 欲去高雄，你買單逝抑是去倒？
    tailo: Beh khì Ko-hiông, lí bé tuann-tsuā iah-sī khì-tò?
    en: For Kaohsiung, are you buying a single or a return?
  - hanji: 高鐵的車票買好矣，月台佇樓跤，緊上車！
    tailo: Ko-thih ê tshia-phiò bé hó--ah, gua̍t-tâi tī lâu-kha, kín tsiūnn-tshia!
    en: The high-speed rail tickets are bought; the platform is downstairs, hurry and get on!
