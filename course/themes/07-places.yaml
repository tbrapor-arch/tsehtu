    zh: 罰單
  - hanji: 罰款
    tailo: hua̍t-khuán
    en: fine; pay a fine
    zh: 罰款
  text:
  - hanji: 臺北的機車真濟，路口定定窒車。
    tailo: Tâi-pak ê ki-tshia tsin tsē, lōo-kháu tiānn-tiānn that-tshia.
    en: Taipei has lots of scooters, and the junctions are often jammed.
  - hanji: 紅燈愛停，行斑馬線較安全。
    tailo: Âng-ting ài thîng, kiânn pan-má-suànn khah an-tsuân.
    en: Stop at a red light; it's safer to cross at the zebra crossing.
  - hanji: 停車場無車位，我共車停佇路邊。
    tailo: Thîng-tshia-tiûnn bô tshia-uī, guá kā tshia thîng tī lōo-pinn.
    en: There were no spaces in the car park, so I parked by the road.
  - hanji: 隔轉工就收著罰單，愛罰款一千二。
    tailo: Keh-tńg-kang tō siu-tio̍h hua̍t-tuann, ài hua̍t-khuán tsi̍t-tshing-jī.
    en: "The next day I got a ticket: a fine of 1,200."
