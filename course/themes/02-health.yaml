id: health
title:
  en: Body and health
  hanji: 身體佮健康
  tailo: sin-thé kap kiān-khong
intro: >-
  The body and health: feeling ill, symptoms, the doctor, medicine, then the parts of the body, its needs, birth and death. Sections 1–4 end with a short text that uses the words.
