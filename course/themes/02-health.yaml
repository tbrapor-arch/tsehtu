    tailo: Guá tsa-hng phuà-pēnn, kui-kang lóng tsin kan-khóo.
    en: I fell ill yesterday and felt awful all day.
  - hanji: 今仔日較有精神矣。
    tailo: Kin-á-ji̍t khah ū tsing-sîn--ah.
    en: Today I have a bit more energy.
  - hanji: 醫生講我愛加歇睏。
    tailo: I-sing kóng guá ài ke hioh-khùn.
    en: The doctor says I need more rest.
