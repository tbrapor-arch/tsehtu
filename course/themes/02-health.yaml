  text:
  - hanji: 我去巷仔口的診所看醫生。
    tailo: Guá khì hāng-á-kháu ê tsín-sóo khuànn-i-sing.
    en: I went to the clinic at the end of the lane to see a doctor.
  - hanji: 先掛號，護士共我量體溫佮血壓。
    tailo: Sing kuà-hō, hōo-sū kā guá niû thé-un kap hueh-ap.
    en: First I registered, and the nurse took my temperature and blood pressure.
  - hanji: 醫生檢查了，講無要緊。
    tailo: I-sing kiám-tsa liáu, kóng bô iàu-kín.
    en: The doctor examined me and said it was nothing serious.
