    en: The doctor prescribed me some medicine.
  - hanji: 一工食三擺，食飽才食。
    tailo: Tsi̍t kang tsia̍h sann pái, tsia̍h-pá tsiah tsia̍h.
    en: Three times a day, after meals.
  - hanji: 食兩工，就有起色矣。
    tailo: Tsia̍h nn̄g kang, tō ū khí-sik--ah.
    en: After two days I was already getting better.
