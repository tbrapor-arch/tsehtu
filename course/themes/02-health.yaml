notes:
- ref: 1
  text: >-
    勇 ióng is the everyday word for being in good health, especially for older people: 阿公猶真勇 “Grandpa is still going strong.”
- ref: 1
  text: >-
    艱苦 kan-khóo is a false friend: in Taigi it is how you say you feel unwell (不舒服), not only “hardship”.
- ref: 4
  text: 'Medicine is eaten: 食藥仔 tsia̍h io̍h-á. Days are counted with 工 kang (三工 = 三天).'
